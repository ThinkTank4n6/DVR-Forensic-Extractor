<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DVR Forensic Extractor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --graphite:#1f2933; --graphite2:#2b3946; --graphite3:#3a4a59;
  --amber:#e39a2d; --amber2:#f3b85a; --amberbg:#fff4e0;
  --bg:#eef1f4; --panel:#ffffff; --line:#c9d0d8; --text:#1d232b; --muted:#5b6773;
  --ok:#2e7d4f; --bad:#b3261e;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;font-size:13px;color:var(--text);background:var(--bg);height:100vh;display:flex;flex-direction:column}
button,input,select,textarea{font-family:inherit;font-size:13px}
/* title bar */
.titlebar{background:var(--graphite);color:#fff;display:flex;align-items:center;padding:6px 14px;gap:10px}
.logo{width:22px;height:22px;border-radius:4px;background:var(--amber);color:var(--graphite);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:11px}
.titlebar .name{font-weight:600;letter-spacing:.3px}
.titlebar .ver{color:#9fb0c0;font-size:12px}
.titlebar .casebadge{margin-left:auto;color:#cfd9e2;font-size:12px}
/* tabs */
.tabs{background:var(--graphite2);display:flex;padding:0 8px}
.tab{color:#cfd9e2;padding:7px 16px;cursor:pointer;border-top:3px solid transparent;user-select:none}
.tab:hover{color:#fff}
.tab.active{background:var(--panel);color:var(--graphite);border-top-color:var(--amber);font-weight:600}
/* ribbon */
.ribbon{background:var(--panel);border-bottom:1px solid var(--line);display:flex;min-height:92px;padding:4px 6px}
.group{display:flex;flex-direction:column;border-right:1px solid var(--line);padding:0 8px}
.group .btns{display:flex;gap:2px;flex:1;align-items:flex-start}
.group .glabel{text-align:center;color:var(--muted);font-size:11px;padding-top:2px}
.rbtn{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;width:74px;padding:6px 2px;border:1px solid transparent;border-radius:4px;background:none;cursor:pointer;color:var(--text);font-size:12px;line-height:1.15}
.rbtn:hover{background:var(--amberbg);border-color:var(--amber2)}
.rbtn:disabled{opacity:.4;cursor:default;background:none;border-color:transparent}
.rbtn svg{width:28px;height:28px;stroke:var(--graphite3);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rbtn.primary svg{stroke:var(--amber)}
.rcol{display:flex;flex-direction:column;gap:4px;padding:4px 4px;font-size:12px}
.rcol label{display:flex;align-items:center;gap:6px;white-space:nowrap}
.rcol input[type=number],.rcol input[type=text]{width:120px;padding:2px 4px;border:1px solid var(--line);border-radius:3px}
/* body */
.main{flex:1;display:flex;min-height:0}
.side{width:280px;background:var(--panel);border-right:1px solid var(--line);padding:12px;overflow:auto}
.side h3{margin:4px 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.kv{display:grid;grid-template-columns:90px 1fr;gap:3px 8px;margin-bottom:14px;font-size:12px}
.kv div:nth-child(odd){color:var(--muted)}
.mono{font-family:Consolas,"Cascadia Mono",monospace;word-break:break-all}
.content{flex:1;overflow:auto;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px;color:var(--graphite)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid #e3e7eb;padding:5px 6px;text-align:left;vertical-align:top}
th{background:#f5f7f9;font-weight:600;position:sticky;top:0}
tr.sel td{background:var(--amberbg)}
tr.click{cursor:pointer}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px}
.pill.ok{background:#e3f3ea;color:var(--ok)}
.pill.no{background:#fde8e6;color:var(--bad)}
.pill.n{background:#eef1f4;color:var(--muted)}
.form{display:grid;grid-template-columns:170px 1fr;gap:6px 10px;align-items:center}
.form input,.form select,.form textarea{padding:4px 6px;border:1px solid var(--line);border-radius:3px;width:100%}
.form .hint{grid-column:2;color:var(--muted);font-size:11px;margin-top:-3px}
.sub{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.btn{padding:5px 12px;border:1px solid var(--graphite3);background:#fff;border-radius:4px;cursor:pointer}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--graphite);font-weight:600}
.btn:hover{filter:brightness(.96)}
.err{color:var(--bad);margin-top:6px;white-space:pre-wrap}
.muted{color:var(--muted)}
/* clock offset */
.ck{display:grid;grid-template-columns:260px 1fr 1fr;gap:12px;align-items:start}
.ck .card{margin-bottom:0}
.dvrlist div.item{border:1px solid var(--line);border-radius:5px;padding:7px 9px;margin-bottom:6px;cursor:pointer;background:#fff}
.dvrlist div.item.sel{border-color:var(--amber);background:var(--amberbg)}
.dvrlist .off{font-size:12px;color:var(--muted)}
.clockbox{background:#f3f5f7;border-radius:8px;padding:12px 14px;margin:8px 0}
.clockbox .d{font-size:17px;font-weight:600}
.clockbox .t{font-size:34px;font-weight:700;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.clockbox .t.ref{color:#2e7d4f}
.clockbox .t.dvr{color:var(--graphite)}
.seg{display:flex;background:#e6e9ed;border-radius:16px;padding:2px;margin:6px 0}
.seg button{flex:1;border:0;background:none;border-radius:14px;padding:5px 8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--graphite);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:5px 0}
.row input{padding:4px 6px;border:1px solid var(--line);border-radius:3px}
.pm button{width:34px;height:28px;border:1px solid var(--line);background:#dfe3e8;font-size:16px;cursor:pointer}
.pm button:first-child{border-radius:14px 0 0 14px}.pm button:last-child{border-radius:0 14px 14px 0}
.offbig{font-size:18px;font-weight:600;color:var(--graphite)}
.offbig.fast{color:#b3261e}.offbig.slow{color:#1f5f99}
.link{color:#1f5f99;cursor:pointer;font-weight:600;background:none;border:0;padding:0;font-size:14px}
.notes div{background:var(--amberbg);border-left:3px solid var(--amber);padding:5px 8px;margin-top:5px;font-size:12px}
/* status bar */
.status{background:var(--graphite);color:#dfe7ee;display:flex;align-items:center;gap:12px;padding:5px 12px;font-size:12px}
.bar{flex:0 0 260px;height:10px;background:var(--graphite3);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .3s}
.logpane{height:130px;background:#151d25;color:#c5d1dc;font-family:Consolas,monospace;font-size:11.5px;overflow:auto;padding:6px 10px;white-space:pre-wrap}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,22,30,.55);display:none;align-items:center;justify-content:center;z-index:9}
.modal.show{display:flex}
.dlg{background:#fff;border-radius:6px;width:640px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.dlg header{background:var(--graphite);color:#fff;padding:8px 12px;border-radius:6px 6px 0 0;font-weight:600}
.dlg .body{padding:12px;overflow:auto;flex:1}
.dlg footer{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.blist div{padding:4px 6px;cursor:pointer;border-radius:3px}
.blist div:hover{background:var(--amberbg)}
.blist .d::before{content:"\1F4C1  "}
.blist .f::before{content:"\1F5CE  "}
</style>
</head>
<body>
<div class="titlebar">
  <div class="logo">DFX</div><div class="name">DVR Forensic Extractor</div><div class="ver" id="ver"></div>
  <div class="casebadge" id="casebadge">No case open</div>
</div>
<div class="tabs" id="tabs">
  <div class="tab active" data-tab="home">Home</div>
  <div class="tab" data-tab="clock">Clock Offset</div>
  <div class="tab" data-tab="carve">Carve</div>
  <div class="tab" data-tab="sigs">Signatures</div>
  <div class="tab" data-tab="results">Results</div>
  <div class="tab" data-tab="help">Help</div>
</div>
<div class="ribbon" id="ribbon"></div>
<div class="main">
  <div class="side">
    <h3>Case</h3><div class="kv" id="sideCase"></div>
    <h3>Evidence</h3><div class="kv" id="sideEv"></div>
    <h3>Job</h3><div class="kv" id="sideJob"></div>
  </div>
  <div class="content" id="content"></div>
</div>
<div class="logpane" id="log"></div>
<div class="status"><span id="stText">Ready</span><div class="bar"><i id="stBar"></i></div><span id="stPct"></span><span style="margin-left:auto" class="muted">Evidence is opened read-only</span></div>

<div class="modal" id="modal"><div class="dlg"><header id="mTitle"></header><div class="body" id="mBody"></div><footer id="mFoot"></footer></div></div>

<script>
const TOKEN="__DFX_TOKEN__";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{n=Number(n||0);const u=["B","KB","MB","GB","TB"];let i=0;while(n>=1024&&i<4){n/=1024;i++}return (i?n.toFixed(2):n)+" "+u[i]};
async function api(path,body){
  const o=body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json","X-DFX-Token":TOKEN},body:JSON.stringify(body)};
  const r=await fetch(path,o);const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j;
}
let S={},SIGS=[],TAB="home",SELRUN="",EDIT=null,lastLogLen=0;

/* ---------------- icons ---------------- */
const I={
 case:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>',
 open:'<svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg>',
 file:'<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>',
 drive:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="16" cy="12" r="1.5"/><path d="M6 12h6"/></svg>',
 hash:'<svg viewBox="0 0 24 24"><path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16"/></svg>',
 play:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z"/></svg>',
 stop:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><rect x="9" y="9" width="6" height="6"/></svg>',
 resume:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/></svg>',
 sig:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/><path d="M17 15l2 2 3-4"/></svg>',
 add:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
 edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
 del:'<svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>',
 imp:'<svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>',
 exp:'<svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 20h16"/></svg>',
 test:'<svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L5 19a1 1 0 0 0 1 2h12a1 1 0 0 0 1-2l-5-10V3"/></svg>',
 report:'<svg viewBox="0 0 24 24"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
 folder:'<svg viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/><path d="M3 10h18"/></svg>',
 refresh:'<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>',
 book:'<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7M8 11h7"/></svg>',
 clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 save:'<svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg>',
 swap:'<svg viewBox="0 0 24 24"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>',
 live:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
 help:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>',
};
const rb=(id,icon,label,primary)=>`<button class="rbtn ${primary?'primary':''}" id="${id}">${I[icon]}<span>${label}</span></button>`;
const grp=(label,html)=>`<div class="group"><div class="btns">${html}</div><div class="glabel">${label}</div></div>`;

/* ---------------- ribbon per tab ---------------- */
function ribbon(){
  const R=$("#ribbon");
  if(TAB==="home") R.innerHTML=
    grp("Case",rb("bNewCase","case","New / Open Case",1)+rb("bCaseFolder","folder","Case Folder"))+
    grp("Evidence",rb("bImage","file","Image File")+rb("bDrive","drive","Physical Drive")+rb("bHash","hash","Hash Evidence")+rb("bCancelJob","stop","Cancel Job"))+
    grp("Next",rb("bGoCarve","play","Go to Carve",1))+grp("Help",rb("bManual","book","User Manual"));
  if(TAB==="clock") R.innerHTML=
    grp("Recorder",rb("bDvrNew","add","New DVR",1)+rb("bDvrEdit","edit","Edit DVR")+rb("bDvrDel","del","Delete DVR"))+
    grp("Measure",rb("bMeasure","save","Save Measurement",1)+rb("bDvrFromOffset","clock","New DVR from Offset"))+
    grp("Convert",rb("bLogConv","swap","Log Conversion")+rb("bLive","live","Live Conversion"))+
    grp("Report",rb("bClockRep","report","Offset Worksheet",1));
  if(TAB==="carve") R.innerHTML=
    grp("Run",rb("bStart","play","Start Carve",1)+rb("bCancel","stop","Cancel")+rb("bResume","resume","Resume Run"))+
    grp("Options",`<div class="rcol">
       <label><input type="checkbox" id="oDry"> Dry run (log only)</label>
       <label><input type="checkbox" id="oAlign"> Sector-aligned only</label>
       <label>Max items <input type="number" id="oMax" value="0" min="0"></label></div>
     <div class="rcol">
       <label>Start offset <input type="text" id="oStart" value="0"></label>
       <label>End offset <input type="text" id="oEnd" placeholder="end of evidence"></label>
       <label>Chunk (MB) <input type="number" id="oChunk" value="64" min="1"></label></div>
     <div class="rcol"><label>DVR clock</label><select id="oDvr" style="width:170px"><option value="">No offset (device times only)</option>${CK.dvrs.filter(d=>d.measurements.length).map(d=>`<option value="${esc(d.id)}">${esc(d.name)} — ${esc(d.current_offset_text||"")}</option>`).join("")}</select>
       <span class="muted" style="font-size:11px;max-width:170px;white-space:normal">Adds actual (corrected) times to the report</span></div>`);
  if(TAB==="sigs") R.innerHTML=
    grp("Library",rb("bSigNew","add","New",1)+rb("bSigEdit","edit","Edit / Copy")+rb("bSigDel","del","Delete"))+
    grp("Exchange",rb("bSigImp","imp","Import JSON")+rb("bSigExp","exp","Export JSON"))+
    grp("Check",rb("bSigTest","test","Test on File",1));
  if(TAB==="results") R.innerHTML=
    grp("Runs",rb("bRefresh","refresh","Refresh"))+
    grp("Output",rb("bReport","report","Open Report",1)+rb("bRebuild","report","Rebuild Report")+rb("bOpenRun","folder","Open Run Folder"));
  if(TAB==="help") R.innerHTML=grp("Help",rb("bManual","book","User Manual",1)+rb("bAbout","help","About"));
  wire();
}

/* ---------------- content per tab ---------------- */
function content(){
  const C=$("#content");
  if(TAB==="home"){
    C.innerHTML=`<div class="card" style="border-left:4px solid var(--amber);background:var(--amberbg)"><b>Early development build &mdash; not yet tested on real DVR evidence.</b> Do not use for casework until the signatures have been validated.</div><div class="card"><h2>Workflow</h2>
     <ol><li><b>New / Open Case</b> &mdash; choose a case folder and enter case details. Every action is written to <span class="mono">case_log.txt</span> with a UTC time.</li>
     <li><b>Image File</b> (raw, dd, .001 split, E01 with libewf-python) or <b>Physical Drive</b> (run as Administrator, use a write blocker).</li>
     <li><b>Hash Evidence</b> &mdash; MD5 and SHA-256 recorded in the report.</li>
     <li><b>Carve</b> &mdash; pick signatures, set options, start. Long scans checkpoint and can be resumed.</li>
     <li><b>Results</b> &mdash; open the HTML report and carved files.</li></ol>
     <p class="muted">Evidence is only ever opened read-only. Carved items go to <span class="mono">&lt;case&gt;\\runs\\carve_&lt;date_time&gt;</span>.</p></div>`;
  }
  if(TAB==="carve"){
    C.innerHTML=`<div class="card"><h2>Signatures for this scan</h2>
     <table><tr><th></th><th>Name</th><th>Mode</th><th>Header</th><th>Validated</th><th>Source</th><th>Problems</th></tr>
     ${SIGS.map(s=>`<tr><td><input type="checkbox" class="cs" value="${esc(s.id)}" ${s.enabled&&!(s.problems||[]).length?'checked':''} ${(s.problems||[]).length?'disabled':''}></td>
       <td>${esc(s.name)}</td><td>${esc(s.mode)}</td><td class="mono">${esc(s.header)}</td>
       <td>${s.validated?'<span class="pill ok">Yes</span>':'<span class="pill no">No</span>'}</td>
       <td><span class="pill n">${esc(s.origin)}</span></td><td class="err">${esc((s.problems||[]).join("; "))}</td></tr>`).join("")}
     </table><p class="muted">Unvalidated signatures are flagged in the report. Dahua DHAV is off by default until you validate it.</p></div>`;
  }
  if(TAB==="sigs"){
    C.innerHTML=`<div class="card"><h2>Signature library</h2>
     <table id="sigTable"><tr><th>Name</th><th>ID</th><th>Mode</th><th>Header</th><th>Footer</th><th>Max size</th><th>Validated</th><th>Source</th></tr>
     ${SIGS.map(s=>`<tr class="click ${EDIT&&EDIT.id===s.id?'sel':''}" data-id="${esc(s.id)}"><td>${esc(s.name)}</td><td class="mono">${esc(s.id)}</td><td>${esc(s.mode)}</td>
       <td class="mono">${esc(s.header)}</td><td class="mono">${esc(s.footer)}</td><td>${fmt(s.max_size)}</td>
       <td>${s.validated?'<span class="pill ok">Yes</span>':'<span class="pill no">No</span>'}</td><td><span class="pill n">${esc(s.origin)}</span></td></tr>`).join("")}
     </table></div><div id="sigEditor"></div>`;
    C.querySelectorAll("#sigTable tr[data-id]").forEach(tr=>tr.onclick=()=>{EDIT=SIGS.find(s=>s.id===tr.dataset.id);content();});
    if(EDIT&&EDIT._editing) editor();
    else if(EDIT) $("#sigEditor").innerHTML=`<div class="card"><h2>${esc(EDIT.name)}</h2><pre class="mono" style="font-size:11.5px">${esc(JSON.stringify(strip(EDIT),null,2))}</pre></div>`;
  }
  if(TAB==="results") loadRuns();
  if(TAB==="clock") renderClock();
  if(TAB==="help"){
    C.innerHTML=`<div class="card"><h2>User Manual</h2><p>The full manual covers every ribbon button, the signature editor, output files, validation and troubleshooting. <button class="btn amber" onclick="window.open('/manual','_blank')">Open User Manual</button></p></div><div class="card"><h2>Carving modes</h2><table>
     <tr><th>header_footer</th><td>From the header to the first (or last) footer within max size.</td></tr>
     <tr><th>header_length</th><td>Item size read from a field in the header (offset, size, byte order, adjust, multiplier).</td></tr>
     <tr><th>header_maxsize</th><td>Fixed amount from the header. Use for a first look at unknown formats.</td></tr>
     <tr><th>frame_chain</th><td>Follows frame after frame using each frame's length field until the chain breaks. Records frame count, channels and first/last device time.</td></tr>
     <tr><th>box_walk</th><td>ISO media (MP4/MOV): walks top-level boxes to find the true end.</td></tr></table></div>
     <div class="card"><h2>Hex patterns</h2><p>Bytes in hex separated by spaces, <span class="mono">??</span> matches any byte: <span class="mono">52 49 46 46 ?? ?? ?? ?? 41 56 49 20</span>. Footers cannot use wildcards.</p></div>
     <div class="card"><h2>Validation</h2><p>Mark a signature <b>Validated</b> only after it found every planted item, byte-for-byte, in a test image with known contents (for example through the Forensic Tool Validator). The report lists every signature definition used and its validation state.</p></div>`;
  }
}
const strip=s=>{const o={...s};delete o.origin;delete o.problems;delete o._editing;return o};

/* ---------------- signature editor ---------------- */
function editor(){
  const s=EDIT, lf=s.length_field||{}, cf=s.channel_field||{}, tf=s.timestamp_field||{};
  const f=(id,label,val,hint,type="text")=>`<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val??"")}">${hint?`<div class="hint">${hint}</div>`:""}`;
  $("#sigEditor").innerHTML=`<div class="card"><h2>${s.origin==="built-in"?"Copy of built-in signature (saved as a user signature)":"Edit signature"}</h2>
   <div class="form">
    ${f("eId","ID",s.id,"Letters, digits, - and _. Same ID as a built-in replaces it.")}
    ${f("eName","Name",s.name)}
    ${f("eExt","Extension",s.extension)}

function readEditor(){

    header:$("#eHeader").value.trim(),header_offset:num("#eHOff")||0,footer:"",footer_tail:0,footer_search:"first",on_missing_footer:"skip",
    length_field:null,chain_max_gap:0,channel_field:null,timestamp_field:null,
    min_size:num("#eMin")??16,max_size:num("#eMax")??2147483648,sector_aligned:$("#eAl").checked,
    enabled:$("#eEn").checked,validated:$("#eVal").checked,notes:$("#eNotes").value};
  if(m==="header_footer"||m==="frame_chain"){s.footer=$("#eFooter").value.trim();s.footer_tail=num("#eTail")||0;s.footer_search=$("#eFS").value;s.on_missing_footer=$("#eMiss").value}

function browser(title,wantFile,cb,start){
  let cur=start||"";
  const draw=async()=>{
    const r=await api("/api/browse?path="+encodeURIComponent(cur));cur=r.path;
    $("#mBody").innerHTML=`<div class="mono" style="margin-bottom:6px">${esc(r.path||"Computer")}</div>
     <input id="bPath" style="width:100%;padding:4px;margin-bottom:6px" placeholder="or type a full path" value="${esc(r.path)}">
     <div class="blist">${r.parent!==undefined&&r.path?`<div class="d" data-up="1">..</div>`:""}
     ${r.dirs.map(d=>`<div class="d" data-d="${esc(d)}">${esc(d)}</div>`).join("")}
     ${wantFile?r.files.map(f=>`<div class="f" data-f="${esc(f.name)}">${esc(f.name)} <span class="muted">${fmt(f.size)}</span></div>`).join(""):""}</div>
     ${r.error?`<div class="err">${esc(r.error)}</div>`:""}`;

    $("#mBody").querySelectorAll("[data-d]").forEach(e=>e.onclick=()=>{cur=join(r.path,e.dataset.d);draw()});
    $("#mBody").querySelectorAll("[data-f]").forEach(e=>e.onclick=()=>{$("#bPath").value=join(r.path,e.dataset.f)});

  };

}

function parseOff(v){v=(v||"").trim();if(!v)return 0;return v.toLowerCase().startsWith("0x")?parseInt(v,16):Number(v.replace(/,/g,""))}

/* ---------------- clock offset ---------------- */
const CK={dvrs:[],sel:null,dvrMs:null,perf0:0,paused:false,pausedMs:0,refKind:"workstation",extMs:null,extPerf:0,extSource:"",
  incMode:"actual",incVal:null,live:false,status:{},conv:null,liveOff:null,liveAt:0};
const p2=n=>String(n).padStart(2,"0");
function naiveNow(){const d=new Date();return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours(),d.getMinutes(),d.getSeconds(),d.getMilliseconds())}
function nfmt(ms){const d=new Date(ms);return `${d.getUTCFullYear()}-${p2(d.getUTCMonth()+1)}-${p2(d.getUTCDate())} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}:${p2(d.getUTCSeconds())}`}
function ndate(ms){const d=new Date(ms);return `${p2(d.getUTCMonth()+1)}/${p2(d.getUTCDate())}/${d.getUTCFullYear()}`}
function ntime(ms){const d=new Date(ms);let h=d.getUTCHours();const ap=h<12?"AM":"PM";h=h%12||12;return `${p2(h)}:${p2(d.getUTCMinutes())}:${p2(d.getUTCSeconds())} ${ap}`}
function nparse(date,time){if(!date||!time)return null;const [y,m,d]=date.split("-").map(Number);const t=time.split(":").map(Number);return Date.UTC(y,m-1,d,t[0]||0,t[1]||0,t[2]||0)}
const trunc=ms=>Math.floor(ms/1000)*1000;
function dvrNow(){if(CK.dvrMs===null)return null;return CK.paused?CK.pausedMs:CK.dvrMs+(performance.now()-CK.perf0)}
function refNow(){if(CK.refKind==="workstation")return naiveNow();if(CK.extMs===null)return null;return CK.extMs+(performance.now()-CK.extPerf)}
function quickOffset(){const a=dvrNow(),b=refNow();if(a===null||b===null)return null;return Math.round((trunc(a)-trunc(b))/1000)}
function offText(s){if(s===null)return "Set both clocks";if(s===0)return "Time is exact";const a=Math.abs(s),h=Math.floor(a/3600),m=Math.floor(a%3600/60),x=a%60;
  return `DVR is ${h?h+" h ":""}${m?m+" min ":""}${x||(!h&&!m)?x+" s ":""}${s>0?"fast (ahead)":"slow (behind)"}`}
function hms(s){const a=Math.abs(s);return (s<0?"-":"+")+p2(Math.floor(a/3600))+":"+p2(Math.floor(a%3600/60))+":"+p2(a%60)}
const selDvr=()=>CK.dvrs.find(d=>d.id===CK.sel)||null;
async function loadDvrs(){try{CK.dvrs=S.case&&S.case.folder?await api("/api/dvrs"):[]}catch(e){CK.dvrs=[]}}

function renderClock(){
  const C=$("#content");
  if(!S.case||!S.case.folder){C.innerHTML=`<div class="card">Open a case first (Home &rarr; New / Open Case). DVR records and measurements are saved in the case.</div>`;return}
  const d=selDvr();
  const st=CK.status||{};
  C.innerHTML=`<div class="ck">
   <div class="card"><h2>Recorders</h2><div class="dvrlist">${CK.dvrs.map(x=>`<div class="item ${x.id===CK.sel?'sel':''}" data-id="${esc(x.id)}"><b>${esc(x.name)}</b><div class="off">${esc([x.make,x.model].filter(Boolean).join(" "))}</div><div class="off">${esc(x.current_offset_text||"no measurement")}${x.drift?` · drift ${x.drift.rate_s_per_day>=0?"+":""}${x.drift.rate_s_per_day.toFixed(2)} s/day`:""}</div></div>`).join("")||'<p class="muted">No DVRs yet. Use <b>New DVR</b>, or set the clocks and use <b>New DVR from Offset</b>.</p>'}</div></div>

   <div>
    <div class="card"><h2>Time shown on DVR</h2><div class="muted">Running DVR clock &mdash; enter what the recorder's screen shows, then press Set.</div>
     <div class="clockbox"><div class="d" id="ckDvrD">--/--/----</div><div class="t dvr" id="ckDvrT">--:--:-- --</div></div>
     <div class="row"><input type="date" id="ckDvrDate"><input type="time" step="1" id="ckDvrTime"><button class="btn amber" id="ckSet">Set</button><button class="btn" id="ckFromRef" title="Start from the reference time, then adjust">Copy reference</button></div>
     <div class="row"><span class="pm"><button id="ckMinus" title="DVR -1 s">&minus;</button><button id="ckPlus" title="DVR +1 s">+</button></span><button class="btn" id="ckPause">${CK.paused?"Resume":"Pause"}</button><span class="muted">Pause the moment the DVR screen changes second, adjust, then resume.</span></div>
    </div>

    <div class="card" style="margin-top:12px"><h2>Reference time</h2>
     <div class="seg"><button id="ckRefW" class="${CK.refKind==="workstation"?"on":""}">Workstation Clock</button><button id="ckRefE" class="${CK.refKind==="external"?"on":""}">External Clock</button></div>
     ${CK.refKind==="workstation"?`<div class="muted">Live workstation clock${st.sync_source?` &mdash; synced to <b>${esc(st.sync_source)}</b>${st.last_sync?`, last sync ${esc(st.last_sync)}`:""}`:" &mdash; sync source not available (check Windows Time)"}</div>`
       :`<div class="row"><input type="date" id="ckExtDate"><input type="time" step="1" id="ckExtTime"><button class="btn amber" id="ckExtSet">Set</button></div>
         <div class="row"><input id="ckExtSrc" style="flex:1" placeholder="Source, e.g. time.gov, GPS clock, phone (NTP)" value="${esc(CK.extSource)}"></div>`}
     <div class="clockbox"><div class="d" id="ckRefD">--/--/----</div><div class="t ref" id="ckRefT">--:--:-- --</div></div>
     <h3 style="margin:10px 0 2px">Offset</h3><div class="offbig" id="ckOff">Set both clocks</div><div class="mono muted" id="ckOffHms"></div>
     <div class="row" style="margin-top:8px"><input id="ckMNotes" style="flex:1" placeholder="Measurement notes (how the DVR time was read, photo number...)"></div>
     <div class="row">${d?`<button class="btn amber" id="ckSave">Save measurement to “${esc(d.name)}”</button>`:""}<button class="link" id="ckNewFrom">Create New DVR using current offset</button></div>
    </div>
   </div>

   <div>
    <div class="card"><h2>Incident time</h2>
     <div class="muted">${d&&d.measurements.length?`Using saved measurements for <b>${esc(d.name)}</b>${d.drift?" (with drift)":""}.`:`Using the live offset (not saved). Select a DVR with measurements for a logged, reportable conversion.`}</div>
     <div class="seg"><button id="ckIA" class="${CK.incMode==="actual"?"on":""}">Actual</button><button id="ckID" class="${CK.incMode==="dvr"?"on":""}">DVR</button></div>
     <div class="row"><input type="date" id="ckIncDate"><input type="time" step="1" id="ckIncTime"><span class="pm"><button id="ckIMinus">&minus;</button><button id="ckIPlus">+</button></span></div>
     <div class="clockbox"><div class="muted" id="ckIncLbl">${CK.incMode==="actual"?"DVR time":"Actual time"}</div><div class="d" id="ckIncOut" style="font-size:20px">&mdash;</div><div class="mono muted" id="ckIncOff"></div></div>
     <div class="notes" id="ckIncNotes"></div>
     <div class="row"><input id="ckLabel" style="flex:1" placeholder="Event label, e.g. Suspect enters store"><button class="btn" id="ckLog">Log</button></div>
    </div>
    ${CK.live?`<div class="card" style="margin-top:12px"><h2>Live conversion</h2><div class="muted" id="ckLiveSrc"></div>
      <div class="clockbox"><div class="muted">Actual (workstation)</div><div class="t ref" id="ckLA" style="font-size:26px"></div></div>
      <div class="clockbox"><div class="muted">On the DVR right now</div><div class="t dvr" id="ckLD" style="font-size:26px"></div></div></div>`:""}
   </div>
  </div>
  ${d?`<div class="card" style="margin-top:12px"><h2>Measurements &mdash; ${esc(d.name)}</h2>
    <table><tr><th>DVR time</th><th>Reference time</th><th>Offset</th><th>Source</th><th>Examiner</th><th>Recorded</th><th>Notes</th><th></th></tr>
    ${d.measurements.map(m=>`<tr><td class="mono">${esc(m.dvr_time)}</td><td class="mono">${esc(m.reference_time)}</td><td>${esc(m.offset_text)}</td><td>${esc(m.reference_source)}</td><td>${esc(m.examiner)}</td><td>${esc(m.recorded)}</td><td>${esc(m.notes)}</td><td><button class="btn" data-delm="${esc(m.id)}">Delete</button></td></tr>`).join("")||'<tr><td colspan=8 class="muted">None yet</td></tr>'}</table>
    ${d.drift?`<p>Drift: <b>${d.drift.rate_s_per_day>=0?"+":""}${d.drift.rate_s_per_day.toFixed(3)} s/day</b> over ${d.drift.points} measurements (${esc(d.drift.first)} to ${esc(d.drift.last)}).</p>`:d.measurements.length===1?'<p class="muted">Take a second measurement days later to measure drift.</p>':""}
    <h2 style="margin-top:14px">Logged conversions</h2>
    <table><tr><th>Event</th><th>DVR time</th><th>Actual time</th><th>Offset</th><th>Recorded</th></tr>
    ${(d.conversions||[]).map(c=>`<tr><td>${esc(c.label)}</td><td class="mono">${esc(c.dvr_time)}</td><td class="mono"><b>${esc(c.actual_time)}</b></td><td class="mono">${esc(c.offset_hms)}</td><td>${esc(c.recorded)}</td></tr>`).join("")||'<tr><td colspan=5 class="muted">None yet</td></tr>'}</table></div>`:""}`;

  C.querySelectorAll(".dvrlist .item").forEach(el=>el.onclick=()=>{CK.sel=el.dataset.id;CK.liveAt=0;renderClock()});
  C.querySelectorAll("[data-delm]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete this measurement? This is recorded in the case log."))return;
    await api("/api/dvrs/measure/delete",{dvr_id:CK.sel,id:b.dataset.delm});await loadDvrs();renderClock()});
  const setInputs=(di,ti,ms)=>{const f=nfmt(ms);$(di).value=f.slice(0,10);$(ti).value=f.slice(11)};
  if(dvrNow()!==null)setInputs("#ckDvrDate","#ckDvrTime",dvrNow());
  $("#ckSet").onclick=()=>{const v=nparse($("#ckDvrDate").value,$("#ckDvrTime").value);if(v===null)return alert("Enter the DVR date and time.");CK.dvrMs=v;CK.perf0=performance.now();CK.paused=false;$("#ckPause").textContent="Pause"};
  $("#ckFromRef").onclick=()=>{const r=refNow();if(r===null)return alert("Set the reference clock first.");CK.dvrMs=trunc(r);CK.perf0=performance.now()-(r-trunc(r));CK.paused=false;setInputs("#ckDvrDate","#ckDvrTime",CK.dvrMs)};
  const nudge=n=>{if(CK.dvrMs===null)return;if(CK.paused)CK.pausedMs+=n*1000;else CK.dvrMs+=n*1000;setInputs("#ckDvrDate","#ckDvrTime",dvrNow())};
  $("#ckMinus").onclick=()=>nudge(-1);$("#ckPlus").onclick=()=>nudge(1);
  $("#ckPause").onclick=()=>{if(CK.dvrMs===null)return;if(!CK.paused){CK.pausedMs=dvrNow();CK.paused=true;$("#ckPause").textContent="Resume"}else{CK.dvrMs=CK.pausedMs;CK.perf0=performance.now();CK.paused=false;$("#ckPause").textContent="Pause"}};
  $("#ckRefW").onclick=()=>{CK.refKind="workstation";renderClock()};
  $("#ckRefE").onclick=()=>{CK.refKind="external";renderClock()};
  if(CK.refKind==="external"){
    if(CK.extMs!==null)setInputs("#ckExtDate","#ckExtTime",refNow());
    $("#ckExtSet").onclick=()=>{const v=nparse($("#ckExtDate").value,$("#ckExtTime").value);if(v===null)return alert("Enter the reference date and time.");CK.extMs=v;CK.extPerf=performance.now()};
    $("#ckExtSrc").oninput=e=>CK.extSource=e.target.value;
  }
  if($("#ckSave"))$("#ckSave").onclick=saveMeasurement;
  $("#ckNewFrom").onclick=()=>{if(quickOffset()===null)return alert("Set the time shown on the DVR (and the external clock, if used) first.");dvrDialog(null,true)};
  $("#ckIA").onclick=()=>{CK.incMode="actual";renderClock()};
  $("#ckID").onclick=()=>{CK.incMode="dvr";renderClock()};
  if(CK.incVal===null)CK.incVal=trunc(naiveNow());
  setInputs("#ckIncDate","#ckIncTime",CK.incVal);
  const incChanged=()=>{const v=nparse($("#ckIncDate").value,$("#ckIncTime").value);if(v!==null){CK.incVal=v;updateIncident()}};
  $("#ckIncDate").onchange=incChanged;$("#ckIncTime").onchange=incChanged;
  $("#ckIMinus").onclick=()=>{CK.incVal-=1000;setInputs("#ckIncDate","#ckIncTime",CK.incVal);updateIncident()};
  $("#ckIPlus").onclick=()=>{CK.incVal+=1000;setInputs("#ckIncDate","#ckIncTime",CK.incVal);updateIncident()};
  $("#ckLog").onclick=logConversion;
  updateIncident();tickClock();
}
let incTimer=null;
function updateIncident(){
  clearTimeout(incTimer);
  incTimer=setTimeout(async()=>{
    const d=selDvr(),out=$("#ckIncOut");if(!out)return;
    const dir=CK.incMode==="actual"?"actual_to_dvr":"dvr_to_actual";
    if(d&&d.measurements.length){
      try{const r=await api("/api/clock/convert",{dvr_id:d.id,time:nfmt(CK.incVal),direction:dir});CK.conv=r;
        out.textContent=dir==="actual_to_dvr"?r.dvr_time:r.actual_time;$("#ckIncOff").textContent=`${r.offset_hms} · ${r.method}`;
        $("#ckIncNotes").innerHTML=r.notes.map(n=>`<div>${esc(n)}</div>`).join("")}
      catch(e){out.textContent="—";$("#ckIncNotes").innerHTML=`<div>${esc(e.message)}</div>`}
    }else{
      const o=quickOffset();CK.conv=null;
      if(o===null){out.textContent="—";$("#ckIncOff").textContent="Set the DVR clock first";$("#ckIncNotes").innerHTML="";return}
      const r=dir==="actual_to_dvr"?CK.incVal+o*1000:CK.incVal-o*1000;
      out.textContent=nfmt(r);$("#ckIncOff").textContent=`${hms(o)} · live offset (unsaved)`;
      $("#ckIncNotes").innerHTML="<div>Unsaved live offset: save the measurement to a DVR to log this conversion and include drift and daylight-saving checks.</div>";
    }
  },150);
}
function tickClock(){
  if(TAB!=="clock"||!$("#ckDvrT"))return;
  const a=dvrNow(),b=refNow();
  $("#ckDvrD").textContent=a===null?"--/--/----":ndate(a);$("#ckDvrT").textContent=a===null?"--:--:-- --":ntime(a);
  $("#ckRefD").textContent=b===null?"--/--/----":ndate(b);$("#ckRefT").textContent=b===null?"--:--:-- --":ntime(b);
  const o=quickOffset();const el=$("#ckOff");el.textContent=offText(o);el.className="offbig"+(o>0?" fast":o<0?" slow":"");
  $("#ckOffHms").textContent=o===null?"":hms(o)+"  (DVR − reference)";
  if(CK.live&&$("#ckLA")){
    const d=selDvr(),now=trunc(naiveNow());
    if(d&&d.measurements.length&&Date.now()-CK.liveAt>30000){CK.liveAt=Date.now();
      api("/api/clock/convert",{dvr_id:d.id,time:nfmt(now),direction:"actual_to_dvr"}).then(r=>{CK.liveOff=r.offset_s;$("#ckLiveSrc").textContent=`${d.name}: ${r.offset_text} (${r.method})`}).catch(()=>{})}
    const off=d&&d.measurements.length?CK.liveOff:quickOffset();
    if(!(d&&d.measurements.length))$("#ckLiveSrc").textContent="Live (unsaved) offset";
    $("#ckLA").textContent=ndate(now)+"  "+ntime(now);
    $("#ckLD").textContent=off===null||off===undefined?"—":ndate(now+Math.round(off)*1000)+"  "+ntime(now+Math.round(off)*1000);
  }
  requestAnimationFrame(()=>setTimeout(tickClock,200));
}
function captureMeasurement(){
  const a=dvrNow(),b=refNow();if(a===null)throw new Error("Set the time shown on the DVR first.");if(b===null)throw new Error("Set the external reference clock first.");
  const ref=trunc(b),off=Math.round((trunc(a)-ref)/1000);
  return {dvr_time:nfmt(ref+off*1000),reference_time:nfmt(ref),
    reference_kind:CK.refKind,reference_source:CK.refKind==="workstation"?`Workstation clock${CK.status.sync_source?" (synced to "+CK.status.sync_source+")":""}`:(CK.extSource||"External clock"),
    method:"Running DVR clock set from the recorder display in DFX Clock Offset",notes:($("#ckMNotes")||{}).value||""};
}
async function saveMeasurement(){
  const d=selDvr();if(!d)return alert("Select a DVR (or create one) first.");
  try{const m=captureMeasurement();m.dvr_id=d.id;const r=await api("/api/dvrs/measure",m);await loadDvrs();renderClock();
    alert(`Saved: ${r.offset_text}\nDVR ${r.dvr_time}  /  reference ${r.reference_time}`)}catch(e){alert(e.message)}
}
async function logConversion(){
  const d=selDvr();if(!d||!d.measurements.length)return alert("Select a DVR with at least one saved measurement to log a conversion.");
  const label=($("#ckLabel")||{}).value||"";
  try{await api("/api/clock/convert",{dvr_id:d.id,time:nfmt(CK.incVal),direction:CK.incMode==="actual"?"actual_to_dvr":"dvr_to_actual",log:true,label});
    await loadDvrs();renderClock()}catch(e){alert(e.message)}
}
function dvrDialog(d,withOffset){
  d=d||{};
  modal(d.id?"Edit DVR":"New DVR",`<div class="form">
   <label>Name</label><input id="dN" value="${esc(d.name||"")}" placeholder="e.g. Sunoco - office NVR">
   <label>Location</label><input id="dL" value="${esc(d.location||"")}">
   <label>Make</label><input id="dMk" value="${esc(d.make||"")}">
   <label>Model</label><input id="dMo" value="${esc(d.model||"")}">
   <label>Serial</label><input id="dS" value="${esc(d.serial||"")}">
   <label>Channels</label><input id="dC" value="${esc(d.channels||"")}">
   <label>DST setting</label><select id="dDst">${["","Auto DST on","Auto DST off","Unknown"].map(v=>`<option ${v===(d.dst_setting||"")?"selected":""}>${v}</option>`).join("")}</select>
   <label>Notes</label><textarea id="dNo" rows="2">${esc(d.notes||"")}</textarea></div>
   ${withOffset?`<p>The current offset (<b>${esc(offText(quickOffset()))}</b>) will be saved as this DVR's first measurement.</p>`:""}<div class="err" id="dErr"></div>`,
   [["Cancel",closeModal],["Save",async()=>{
     try{const m=withOffset?captureMeasurement():null;const r=await api("/api/dvrs",{id:d.id,name:$("#dN").value,location:$("#dL").value,make:$("#dMk").value,model:$("#dMo").value,serial:$("#dS").value,channels:$("#dC").value,dst_setting:$("#dDst").value,notes:$("#dNo").value});
       if(m){m.dvr_id=r.id;await api("/api/dvrs/measure",m)}
       CK.sel=r.id;closeModal();await loadDvrs();renderClock()}catch(e){$("#dErr").textContent=e.message}},"amber"]]);
}

/* ---------------- state polling ---------------- */
function side(){
  const c=S.case||{},e=S.source||{},h=S.evidence_hash||{},j=S.job||{};
  $("#ver").textContent=S.version||"";
  $("#casebadge").textContent=c.case_number?`Case ${c.case_number}${c.examiner?" · "+c.examiner:""}`:(c.folder?"Case open":"No case open");
  $("#sideCase").innerHTML=c.folder?`<div>Number</div><div>${esc(c.case_number||"")}</div><div>Examiner</div><div>${esc(c.examiner||"")}</div><div>Folder</div><div class="mono">${esc(c.folder)}</div>`:`<div>&mdash;</div><div class="muted">New / Open Case</div>`;
  $("#sideEv").innerHTML=e.path?`<div>Source</div><div class="mono">${esc(e.path)}</div><div>Type</div><div>${esc(e.kind)}</div><div>Size</div><div>${fmt(e.size)}</div>
    <div>MD5</div><div class="mono">${esc(h.md5||"not hashed")}</div><div>SHA-256</div><div class="mono">${esc(h.sha256||"")}</div>`:`<div>&mdash;</div><div class="muted">Image File or Physical Drive</div>`;
  const p=j.progress||{};const pct=p.total?Math.min(100,100*p.done/p.total):0;
  $("#sideJob").innerHTML=j.type?`<div>Job</div><div>${esc(j.type)}${j.running?" (running)":""}</div>${p.items!==undefined?`<div>Items</div><div>${p.items}</div>`:""}
    ${j.error?`<div>Error</div><div class="err">${esc(j.error)}</div>`:""}`:`<div>&mdash;</div><div class="muted">idle</div>`;
  $("#stBar").style.width=(j.running?pct:0)+"%";
  $("#stPct").textContent=j.running?`${pct.toFixed(1)}%  ${fmt(p.done)} / ${fmt(p.total)}${p.elapsed&&p.done?"  ·  "+eta(p):""}`:"";
  $("#stText").textContent=j.running?`${j.type==="carve"?"Carving":"Hashing"}…`:(j.error?"Last job failed":"Ready");
  const log=j.log||[];if(log.length!==lastLogLen){$("#log").textContent=log.join("\n");$("#log").scrollTop=1e9;lastLogLen=log.length}
}
function eta(p){const rate=p.done/p.elapsed;const s=(p.total-p.done)/rate;if(!isFinite(s))return"";const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return `${(rate/1048576).toFixed(0)} MB/s, ${h}h ${m}m left`}
let wasRunning=false;
async function refresh(){try{S=await api("/api/state");side();if(wasRunning&&!S.job.running&&TAB==="results")loadRuns();wasRunning=S.job.running}catch(e){$("#stText").textContent="Server not responding"}}
async function loadSigs(){SIGS=await api("/api/signatures")}
(async()=>{await loadSigs();await refresh();setTab("home");setInterval(refresh,1000)})();
</script>
