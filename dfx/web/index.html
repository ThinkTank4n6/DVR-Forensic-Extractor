<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DVR Forensic Extractor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --graphite:#1f2933; --graphite2:#2b3946; --graphite3:#3a4a59;
  --amber:#e39a2d; --amber2:#f3b85a; --amberbg:#fff4e0;
  --bg:#eef1f4; --panel:#ffffff; --line:#c9d0d8; --text:#1d232b; --muted:#5b6773;
  --ok:#2e7d4f; --bad:#b3261e;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;font-size:13px;color:var(--text);background:var(--bg);height:100vh;display:flex;flex-direction:column}
button,input,select,textarea{font-family:inherit;font-size:13px}
/* title bar */
.titlebar{background:var(--graphite);color:#fff;display:flex;align-items:center;padding:6px 14px;gap:10px}
.logo{width:22px;height:22px;border-radius:4px;background:var(--amber);color:var(--graphite);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:11px}
.titlebar .name{font-weight:600;letter-spacing:.3px}
.titlebar .ver{color:#9fb0c0;font-size:12px}
.titlebar .casebadge{margin-left:auto;color:#cfd9e2;font-size:12px}
/* tabs */
.tabs{background:var(--graphite2);display:flex;padding:0 8px}
.tab{color:#cfd9e2;padding:7px 16px;cursor:pointer;border-top:3px solid transparent;user-select:none}
.tab:hover{color:#fff}
.tab.active{background:var(--panel);color:var(--graphite);border-top-color:var(--amber);font-weight:600}
/* ribbon */
.ribbon{background:var(--panel);border-bottom:1px solid var(--line);display:flex;min-height:92px;padding:4px 6px}
.group{display:flex;flex-direction:column;border-right:1px solid var(--line);padding:0 8px}
.group .btns{display:flex;gap:2px;flex:1;align-items:flex-start}
.group .glabel{text-align:center;color:var(--muted);font-size:11px;padding-top:2px}
.rbtn{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;width:74px;padding:6px 2px;border:1px solid transparent;border-radius:4px;background:none;cursor:pointer;color:var(--text);font-size:12px;line-height:1.15}
.rbtn:hover{background:var(--amberbg);border-color:var(--amber2)}
.rbtn:disabled{opacity:.4;cursor:default;background:none;border-color:transparent}
.rbtn svg{width:28px;height:28px;stroke:var(--graphite3);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rbtn.primary svg{stroke:var(--amber)}
.rcol{display:flex;flex-direction:column;gap:4px;padding:4px 4px;font-size:12px}
.rcol label{display:flex;align-items:center;gap:6px;white-space:nowrap}
.rcol input[type=number],.rcol input[type=text]{width:120px;padding:2px 4px;border:1px solid var(--line);border-radius:3px}
/* body */
.main{flex:1;display:flex;min-height:0}
.side{width:280px;background:var(--panel);border-right:1px solid var(--line);padding:12px;overflow:auto}
.side h3{margin:4px 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.kv{display:grid;grid-template-columns:90px 1fr;gap:3px 8px;margin-bottom:14px;font-size:12px}
.kv div:nth-child(odd){color:var(--muted)}
.mono{font-family:Consolas,"Cascadia Mono",monospace;word-break:break-all}
.content{flex:1;overflow:auto;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px;color:var(--graphite)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid #e3e7eb;padding:5px 6px;text-align:left;vertical-align:top}
th{background:#f5f7f9;font-weight:600;position:sticky;top:0}
tr.sel td{background:var(--amberbg)}
tr.click{cursor:pointer}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px}
.pill.ok{background:#e3f3ea;color:var(--ok)}
.pill.no{background:#fde8e6;color:var(--bad)}
.pill.n{background:#eef1f4;color:var(--muted)}
.form{display:grid;grid-template-columns:170px 1fr;gap:6px 10px;align-items:center}
.form input,.form select,.form textarea{padding:4px 6px;border:1px solid var(--line);border-radius:3px;width:100%}
.form .hint{grid-column:2;color:var(--muted);font-size:11px;margin-top:-3px}
.sub{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.btn{padding:5px 12px;border:1px solid var(--graphite3);background:#fff;border-radius:4px;cursor:pointer}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--graphite);font-weight:600}
.btn:hover{filter:brightness(.96)}
.err{color:var(--bad);margin-top:6px;white-space:pre-wrap}
.muted{color:var(--muted)}
/* clock offset */
.ck{display:grid;grid-template-columns:260px 1fr 1fr;gap:12px;align-items:start}
.ck .card{margin-bottom:0}
.dvrlist div.item{border:1px solid var(--line);border-radius:5px;padding:7px 9px;margin-bottom:6px;cursor:pointer;background:#fff}
.dvrlist div.item.sel{border-color:var(--amber);background:var(--amberbg)}
.dvrlist .off{font-size:12px;color:var(--muted)}
.clockbox{background:#f3f5f7;border-radius:8px;padding:12px 14px;margin:8px 0}
.clockbox .d{font-size:17px;font-weight:600}
.clockbox .t{font-size:34px;font-weight:700;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.clockbox .t.ref{color:#2e7d4f}
.clockbox .t.dvr{color:var(--graphite)}
.seg{display:flex;background:#e6e9ed;border-radius:16px;padding:2px;margin:6px 0}
.seg button{flex:1;border:0;background:none;border-radius:14px;padding:5px 8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--graphite);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:5px 0}
.row input{padding:4px 6px;border:1px solid var(--line);border-radius:3px}
.pm button{width:34px;height:28px;border:1px solid var(--line);background:#dfe3e8;font-size:16px;cursor:pointer}
.pm button:first-child{border-radius:14px 0 0 14px}.pm button:last-child{border-radius:0 14px 14px 0}
.offbig{font-size:18px;font-weight:600;color:var(--graphite)}
.offbig.fast{color:#b3261e}.offbig.slow{color:#1f5f99}
.link{color:#1f5f99;cursor:pointer;font-weight:600;background:none;border:0;padding:0;font-size:14px}
.notes div{background:var(--amberbg);border-left:3px solid var(--amber);padding:5px 8px;margin-top:5px;font-size:12px}
/* hex viewer */
.hx{display:grid;grid-template-columns:1fr 330px;gap:12px;align-items:start}
.hxgrid{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px;line-height:1.55;user-select:none;overflow:auto;max-height:calc(100vh - 230px)}
.hxrow{display:flex;gap:14px;white-space:pre}
.hxoff{color:var(--muted)}
.hxbytes span,.hxasc span{cursor:pointer;padding:0 1px;border-radius:2px}
.hxbytes span{display:inline-block;width:2.1ch;text-align:center;margin-right:.6ch}
.hxbytes span:nth-child(8){margin-right:1.4ch}
.hxasc span{display:inline-block;width:1ch}
.hxsel{background:var(--amber)!important;color:var(--graphite)}
.hxhdr{outline:2px solid #2e7d4f;background:#e3f3ea}
.hxlen{background:#dce9f7}
.hxfoot{background:#f3e1f7}
.hxhl{background:#fff4e0}
.kvs{display:grid;grid-template-columns:118px 1fr;gap:2px 8px;font-size:12px}
.kvs div:nth-child(odd){color:var(--muted)}
.legend span{display:inline-block;padding:0 6px;margin-right:4px;border-radius:3px;font-size:11px}
@media (max-height:640px){.hxgrid{max-height:calc(100vh - 150px)}}
/* status bar */
.status{background:var(--graphite);color:#dfe7ee;display:flex;align-items:center;gap:12px;padding:5px 12px;font-size:12px}
.bar{flex:0 0 260px;height:10px;background:var(--graphite3);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .3s}
.logwrap{display:none;flex-direction:column;background:#151d25}
.logwrap.open{display:flex}
.loggrip{height:6px;cursor:ns-resize;background:var(--graphite3)}
.loggrip:hover{background:var(--amber)}
.logpane{height:150px;color:#c5d1dc;font-family:Consolas,monospace;font-size:11.5px;overflow:auto;padding:6px 10px;white-space:pre-wrap}
.status .lastlog{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#9fb0c0;font-family:Consolas,monospace;font-size:11.5px}
.toast{position:fixed;right:16px;bottom:40px;max-width:520px;background:var(--graphite);color:#fff;border-left:4px solid var(--amber);
  padding:8px 12px;border-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,.3);font-size:13px;z-index:20;display:none}
.toast.show{display:block}
.toast.ok{border-left-color:#4caf7d}.toast.bad{border-left-color:#e5534b}
.logbtn{background:var(--graphite3);color:#fff;border:0;border-radius:3px;padding:2px 9px;cursor:pointer;font-size:12px;white-space:nowrap}
.logbtn:hover{background:var(--amber);color:var(--graphite)}
@media (max-height:640px){
  .titlebar{padding:3px 12px}
  .tab{padding:4px 14px}
  .ribbon{min-height:0;padding:2px 4px}
  .rbtn{width:auto;flex-direction:row;gap:5px;padding:4px 8px;font-size:12px;white-space:nowrap}
  .rbtn svg{width:18px;height:18px}
  .rbtn span br{display:none}
  .group .glabel{display:none}
  .group .btns{flex-wrap:wrap;align-items:center}
  .rcol{gap:2px;padding:2px}
  .content{padding:8px}
}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,22,30,.55);display:none;align-items:center;justify-content:center;z-index:9}
.modal.show{display:flex}
.dlg{background:#fff;border-radius:6px;width:640px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.dlg header{background:var(--graphite);color:#fff;padding:8px 12px;border-radius:6px 6px 0 0;font-weight:600}
.dlg .body{padding:12px;overflow:auto;flex:1}
.dlg footer{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.blist div{padding:4px 6px;cursor:pointer;border-radius:3px}
.blist div:hover{background:var(--amberbg)}
.blist .d::before{content:"\1F4C1  "}
.blist .f::before{content:"\1F5CE  "}
</style>
</head>
<body>
<div class="titlebar">
  <div class="logo">DFX</div><div class="name">DVR Forensic Extractor</div><div class="ver" id="ver"></div>
  <div class="casebadge" id="casebadge">No case open</div>
</div>
<div class="tabs" id="tabs">
  <div class="tab active" data-tab="home">Home</div>
  <div class="tab" data-tab="clock">Clock Offset</div>
  <div class="tab" data-tab="carve">Carve</div>
  <div class="tab" data-tab="sigs">Signatures</div>
  <div class="tab" data-tab="results">Results</div>
  <div class="tab" data-tab="hex">Hex</div>
  <div class="tab" data-tab="help">Help</div>
</div>
<div class="ribbon" id="ribbon"></div>
<div class="main">
  <div class="side">
    <h3>Case</h3><div class="kv" id="sideCase"></div>
    <h3>Evidence</h3><div class="kv" id="sideEv"></div>
    <h3>Job</h3><div class="kv" id="sideJob"></div>
  </div>
  <div class="content" id="content"></div>
</div>
<div class="logwrap" id="logwrap"><div class="loggrip" id="loggrip" title="Drag to resize"></div><div class="logpane" id="log"></div></div>
<div class="status"><span id="stText">Ready</span><div class="bar"><i id="stBar"></i></div><span id="stPct"></span><span class="lastlog" id="lastlog"></span><span class="muted">Evidence is opened read-only</span><button class="logbtn" id="logbtn" title="Show or hide the case log">Log &#9650;</button></div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="dlg"><header id="mTitle"></header><div class="body" id="mBody"></div><footer id="mFoot"></footer></div></div>

<script>
const TOKEN="__DFX_TOKEN__";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{n=Number(n||0);const u=["B","KB","MB","GB","TB"];let i=0;while(n>=1024&&i<4){n/=1024;i++}return (i?n.toFixed(2):n)+" "+u[i]};
async function api(path,body){
  const o=body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json","X-DFX-Token":TOKEN},body:JSON.stringify(body)};
  const r=await fetch(path,o);const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j;
}
let S={},SIGS=[],TAB="home",SELRUN="",EDIT=null,lastLogLen=0,SELITEM=null,RUNS=[];

/* ---------------- icons ---------------- */
const I={
 case:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>',
 open:'<svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg>',
 file:'<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>',
 drive:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="16" cy="12" r="1.5"/><path d="M6 12h6"/></svg>',
 hash:'<svg viewBox="0 0 24 24"><path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16"/></svg>',
 play:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z"/></svg>',
 stop:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><rect x="9" y="9" width="6" height="6"/></svg>',
 resume:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/></svg>',
 sig:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/><path d="M17 15l2 2 3-4"/></svg>',
 add:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
 edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
 del:'<svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>',
 imp:'<svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>',
 exp:'<svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 20h16"/></svg>',
 test:'<svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L5 19a1 1 0 0 0 1 2h12a1 1 0 0 0 1-2l-5-10V3"/></svg>',
 report:'<svg viewBox="0 0 24 24"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
 folder:'<svg viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/><path d="M3 10h18"/></svg>',
 refresh:'<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>',
 book:'<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7M8 11h7"/></svg>',
 clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 save:'<svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg>',
 swap:'<svg viewBox="0 0 24 24"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>',
 live:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
 hexi:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h2M11 9h2M15 9h2M7 13h2M11 13h2M7 17h2"/></svg>',
 left:'<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
 right:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
 find:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>',
 hdr:'<svg viewBox="0 0 24 24"><path d="M4 4h16v5H4z"/><path d="M4 13h10M4 17h7"/></svg>',
 len:'<svg viewBox="0 0 24 24"><path d="M3 12h18M3 8v8M21 8v8M7 12l-2-2M7 12l-2 2M17 12l2-2M17 12l2 2"/></svg>',
 foot:'<svg viewBox="0 0 24 24"><path d="M4 15h16v5H4z"/><path d="M4 5h10M4 9h7"/></svg>',
 jump:'<svg viewBox="0 0 24 24"><path d="M5 18c2-8 8-12 14-12"/><path d="M15 3l4 3-4 3"/></svg>',
 learn:'<svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M7 11v5c3 2 7 2 10 0v-5"/></svg>',
 help:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>',
};
const rb=(id,icon,label,primary)=>`<button class="rbtn ${primary?'primary':''}" id="${id}">${I[icon]}<span>${label}</span></button>`;
const grp=(label,html)=>`<div class="group"><div class="btns">${html}</div><div class="glabel">${label}</div></div>`;

/* ---------------- ribbon per tab ---------------- */
function ribbon(){
  const R=$("#ribbon");
  if(TAB==="home") R.innerHTML=
    grp("Case",rb("bNewCase","case","New / Open Case",1)+rb("bCaseFolder","folder","Case Folder"))+
    grp("Evidence",rb("bImage","file","Image File")+rb("bDrive","drive","Physical Drive")+rb("bHash","hash","Hash Evidence")+rb("bCancelJob","stop","Cancel Job"))+
    grp("Next",rb("bGoCarve","play","Go to Carve",1))+grp("Help",rb("bManual","book","User Manual"));
  if(TAB==="clock") R.innerHTML=
    grp("Recorder",rb("bDvrNew","add","New DVR",1)+rb("bDvrEdit","edit","Edit DVR")+rb("bDvrDel","del","Delete DVR"))+
    grp("Measure",rb("bMeasure","save","Save Measurement",1)+rb("bDvrFromOffset","clock","New DVR from Offset"))+
    grp("Convert",rb("bLogConv","swap","Log Conversion")+rb("bLive","live","Live Conversion"))+
    grp("Report",rb("bClockRep","report","Offset Worksheet",1));
  if(TAB==="carve") R.innerHTML=
    grp("Run",rb("bStart","play","Start Carve",1)+rb("bCancel","stop","Cancel")+rb("bResume","resume","Resume Run"))+
    grp("Options",`<div class="rcol">
       <label><input type="checkbox" id="oDry"> Dry run (log only)</label>
       <label><input type="checkbox" id="oAlign"> Sector-aligned only</label>
       <label>Max items <input type="number" id="oMax" value="0" min="0"></label></div>
     <div class="rcol">
       <label>Start offset <input type="text" id="oStart" value="0"></label>
       <label>End offset <input type="text" id="oEnd" placeholder="end of evidence"></label>
       <label>Chunk (MB) <input type="number" id="oChunk" value="64" min="1"></label></div>
     <div class="rcol"><label>DVR clock</label><select id="oDvr" style="width:170px"><option value="">No offset (device times only)</option>${CK.dvrs.filter(d=>d.measurements.length).map(d=>`<option value="${esc(d.id)}">${esc(d.name)} — ${esc(d.current_offset_text||"")}</option>`).join("")}</select>
       <span class="muted" style="font-size:11px;max-width:170px;white-space:normal">Adds actual (corrected) times to the report</span></div>`);
  if(TAB==="sigs") R.innerHTML=
    grp("Library",rb("bSigNew","add","New",1)+rb("bSigEdit","edit","Edit / Copy")+rb("bSigDel","del","Delete"))+
    grp("Exchange",rb("bSigImp","imp","Import JSON")+rb("bSigExp","exp","Export JSON"))+
    grp("Check",rb("bSigTest","test","Test on File",1)+rb("bValidate","sig","Validate"))+
    grp("Learn",rb("bLearn","learn","Learn from Samples",1));
  if(TAB==="results") R.innerHTML=
    grp("Runs",rb("bRefresh","refresh","Refresh"))+
    grp("Output",rb("bReport","report","Open Report",1)+rb("bRebuild","report","Rebuild Report")+rb("bOpenRun","folder","Open Run Folder"))+
    grp("Item",rb("bViewHex","hexi","View in Hex"));
  if(TAB==="hex") R.innerHTML=
    grp("Source",rb("bHxEv","drive","Evidence",1)+rb("bHxFile","file","Open File"))+
    grp("Navigate",rb("bHxPrev","left","Previous")+rb("bHxNext","right","Next")+`<div class="rcol">
       <label>Offset <input type="text" id="hxGo" placeholder="0x1000 or 4096"></label>
       <label>Find <input type="text" id="hxQ" placeholder="44 48 41 56 or text"></label>
       <label><select id="hxQm"><option value="hex">hex</option><option value="text">text</option></select> <button class="btn" id="hxGoB">Go</button> <button class="btn" id="hxFindB">Find next</button></label></div>`)+
    grp("Build signature",rb("bHxHdr","hdr","Use as Header",1)+rb("bHxLen","len","Length Field")+rb("bHxFoot","foot","Use as Footer")+rb("bHxFollow","jump","Follow Length")+rb("bHxEdit","edit","Open in Editor"))+
    grp("Learner",rb("bHxSample","learn","Add as Sample"));
  if(TAB==="help") R.innerHTML=grp("Help",rb("bManual","book","User Manual",1)+rb("bAbout","help","About"));
  wire();
}

/* ---------------- content per tab ---------------- */
function content(){
  const C=$("#content");
  if(TAB==="home"){
    C.innerHTML=`<div class="card" style="border-left:4px solid var(--amber);background:var(--amberbg)"><b>Early development build &mdash; not yet tested on real DVR evidence.</b> Do not use for casework until the signatures have been validated.</div><div class="card"><h2>Workflow</h2>
     <ol><li><b>New / Open Case</b> &mdash; choose a case folder and enter case details. Every action is written to <span class="mono">case_log.txt</span> with a UTC time.</li>
     <li><b>Image File</b> (raw, dd, .001 split, E01/Ex01, AFF, VHD/VHDX, VMDK &mdash; built in) or <b>Physical Drive</b> (run as Administrator, use a write blocker).</li>
     <li><b>Hash Evidence</b> &mdash; MD5 and SHA-256 recorded in the report.</li>
     <li><b>Carve</b> &mdash; pick signatures, set options, start. Long scans checkpoint and can be resumed.</li>
     <li><b>Results</b> &mdash; open the HTML report and carved files.</li></ol>
     <p class="muted">Evidence is only ever opened read-only. Carved items go to <span class="mono">&lt;case&gt;\\runs\\carve_&lt;date_time&gt;</span>.</p></div>`;
  }
  if(TAB==="carve"){
    C.innerHTML=`<div class="card"><h2>Signatures for this scan</h2>
     <table><tr><th></th><th>Name</th><th>Mode</th><th>Header</th><th>Validated</th><th>Source</th><th>Problems</th></tr>
     ${SIGS.map(s=>`<tr><td><input type="checkbox" class="cs" value="${esc(s.id)}" ${s.enabled&&!(s.problems||[]).length?'checked':''} ${(s.problems||[]).length?'disabled':''}></td>
       <td>${esc(s.name)}</td><td>${esc(s.mode)}</td><td class="mono">${esc(s.header)}</td>
       <td>${s.validated?'<span class="pill ok">Yes</span>':'<span class="pill no">No</span>'}</td>
       <td><span class="pill n">${esc(s.origin)}</span></td><td class="err">${esc((s.problems||[]).join("; "))}</td></tr>`).join("")}
     </table><p class="muted">Unvalidated signatures are flagged in the report. Dahua DHAV is off by default until you validate it.</p></div>`;
  }
  if(TAB==="sigs"){
    C.innerHTML=(VAL.open?validateCard():"")+(LRN.open?learnerCard():"")+`<div class="card"><h2>Signature library</h2>
     <table id="sigTable"><tr><th>Name</th><th>ID</th><th>Mode</th><th>Header</th><th>Footer</th><th>Max size</th><th>Validated</th><th>Source</th></tr>
     ${SIGS.map(s=>`<tr class="click ${EDIT&&EDIT.id===s.id?'sel':''}" data-id="${esc(s.id)}"><td>${esc(s.name)}</td><td class="mono">${esc(s.id)}</td><td>${esc(s.mode)}</td>
       <td class="mono">${esc(s.header)}</td><td class="mono">${esc(s.footer)}</td><td>${fmt(s.max_size)}</td>
       <td>${s.validated?(s.validation?`<span class="pill ok" title="${esc(s.validation.date)} with DFX ${esc(s.validation.dfx_version)}">Yes${s.validation.dfx_version!==S.version?" (older DFX)":""}</span>`:'<span class="pill ok" title="marked by the examiner; no DFX validation record">Yes*</span>'):'<span class="pill no">No</span>'}</td><td><span class="pill n">${esc(s.origin)}</span></td></tr>`).join("")}
     </table></div><div id="sigEditor"></div>`;
    C.querySelectorAll("#sigTable tr[data-id]").forEach(tr=>tr.onclick=()=>{EDIT=SIGS.find(s=>s.id===tr.dataset.id);content();});
    if(LRN.open)wireLearner();
    if(VAL.open)wireValidate();
    if(EDIT&&EDIT._editing) editor();
    else if(EDIT) $("#sigEditor").innerHTML=`<div class="card"><h2>${esc(EDIT.name)}</h2><pre class="mono" style="font-size:11.5px">${esc(JSON.stringify(strip(EDIT),null,2))}</pre></div>`;
  }
  if(TAB==="results") loadRuns();
  if(TAB==="clock") renderClock();
  if(TAB==="hex") renderHex();
  if(TAB==="help"){
    C.innerHTML=`<div class="card"><h2>User Manual</h2><p>The full manual covers every ribbon button, the signature editor, output files, validation and troubleshooting. <button class="btn amber" onclick="window.open('/manual','_blank')">Open User Manual</button></p></div><div class="card"><h2>Carving modes</h2><table>
     <tr><th>header_footer</th><td>From the header to the first (or last) footer within max size.</td></tr>
     <tr><th>header_length</th><td>Item size read from a field in the header (offset, size, byte order, adjust, multiplier).</td></tr>
     <tr><th>header_maxsize</th><td>Fixed amount from the header. Use for a first look at unknown formats.</td></tr>
     <tr><th>frame_chain</th><td>Follows frame after frame using each frame's length field until the chain breaks. Records frame count, channels and first/last device time.</td></tr>
     <tr><th>box_walk</th><td>ISO media (MP4/MOV): walks top-level boxes to find the true end.</td></tr></table></div>
     <div class="card"><h2>Hex patterns</h2><p>Bytes in hex separated by spaces, <span class="mono">??</span> matches any byte: <span class="mono">52 49 46 46 ?? ?? ?? ?? 41 56 49 20</span>. Footers cannot use wildcards.</p></div>
     <div class="card"><h2>Validation</h2><p>Mark a signature <b>Validated</b> only after it found every planted item, byte-for-byte, in a test image with known contents (for example through the Forensic Tool Validator). The report lists every signature definition used and its validation state.</p></div>`;
  }
}
const strip=s=>{const o={...s};delete o.origin;delete o.problems;delete o._editing;return o};

/* ---------------- signature editor ---------------- */
function editor(){
  const s=EDIT, lf=s.length_field||{}, cf=s.channel_field||{}, tf=s.timestamp_field||{};
  const f=(id,label,val,hint,type="text")=>`<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val??"")}">${hint?`<div class="hint">${hint}</div>`:""}`;
  $("#sigEditor").innerHTML=`<div class="card"><h2>${s.origin==="built-in"?"Copy of built-in signature (saved as a user signature)":"Edit signature"}</h2>
   <div class="form">
    ${f("eId","ID",s.id,"Letters, digits, - and _. Same ID as a built-in replaces it.")}
    ${f("eName","Name",s.name)}
    ${f("eExt","Extension",s.extension)}
    <label>Mode</label><select id="eMode">${["header_footer","header_length","header_maxsize","frame_chain","box_walk","asf_walk"].map(m=>`<option ${m===s.mode?"selected":""}>${m}</option>`).join("")}</select>
    ${f("eHeader","Header (hex)",s.header,"?? = any byte")}
    ${f("eHOff","Header offset",s.header_offset,"Where the header sits inside the item (MP4 ftyp = 4)","number")}
    <div class="m-foot" style="display:contents">
     ${f("eFooter","Footer (hex)",s.footer)}
     ${f("eTail","Bytes after footer",s.footer_tail,"Kept after the footer, e.g. a trailing length field","number")}
     <label>Footer search</label><select id="eFS"><option ${s.footer_search==="first"?"selected":""}>first</option><option ${s.footer_search==="last"?"selected":""}>last</option></select>
     <label>If footer missing</label><select id="eMiss"><option ${s.on_missing_footer==="skip"?"selected":""}>skip</option><option ${s.on_missing_footer==="maxsize"?"selected":""}>maxsize</option></select>
    </div>
    <div class="m-len" style="display:contents"><label>Length field</label><div class="sub">
      <input id="lOff" type="number" placeholder="offset" value="${esc(lf.offset??"")}" title="offset">
      <select id="lSize">${[1,2,4,8].map(n=>`<option ${Number(lf.size||4)===n?"selected":""}>${n}</option>`).join("")}</select>
      <select id="lEnd"><option ${lf.endian!=="big"?"selected":""}>little</option><option ${lf.endian==="big"?"selected":""}>big</option></select>
      <input id="lAdj" type="number" placeholder="adjust" value="${esc(lf.adjust??0)}" title="adjust">
      <input id="lMul" type="number" placeholder="multiplier" value="${esc(lf.multiplier??1)}" title="multiplier"></div>
      <div class="hint">offset &middot; size &middot; byte order &middot; adjust &middot; multiplier. Length = value &times; multiplier + adjust, measured from the item start.</div></div>
    <div class="m-chain" style="display:contents">
     ${f("eGap","Max gap between frames",s.chain_max_gap,"0 = frames must be back-to-back","number")}
     <label>Channel field</label><div class="sub"><input id="cOff" type="number" placeholder="offset" value="${esc(cf.offset??"")}"><select id="cSize">${[1,2,4].map(n=>`<option ${Number(cf.size||1)===n?"selected":""}>${n}</option>`).join("")}</select></div>
     <label>Timestamp field</label><div class="sub"><input id="tOff" type="number" placeholder="offset" value="${esc(tf.offset??"")}">
       <select id="tSize">${[4,8].map(n=>`<option ${Number(tf.size||4)===n?"selected":""}>${n}</option>`).join("")}</select>
       <select id="tEnd"><option ${tf.endian!=="big"?"selected":""}>little</option><option ${tf.endian==="big"?"selected":""}>big</option></select>
       <select id="tFmt">${["unix","dahua_packed","filetime"].map(n=>`<option ${tf.format===n?"selected":""}>${n}</option>`).join("")}</select></div>
     <div class="hint">Leave offsets blank to skip.</div></div>
    ${f("eMin","Min size (bytes)",s.min_size,"","number")}
    ${f("eMax","Max size (bytes)",s.max_size,"","number")}
    <label>Sector-aligned</label><div><input type="checkbox" id="eAl" ${s.sector_aligned?"checked":""} style="width:auto"> only accept items starting on a sector boundary</div>
    <label>Enabled by default</label><div><input type="checkbox" id="eEn" ${s.enabled?"checked":""} style="width:auto"></div>
    <label>Validated</label><div><input type="checkbox" id="eVal" ${s.validated?"checked":""} style="width:auto"> passed my validation tests with this version</div>
    <label>Notes</label><textarea id="eNotes" rows="3">${esc(s.notes)}</textarea>
   </div>
   <div style="margin-top:12px;display:flex;gap:8px"><button class="btn amber" id="eSave">Save</button><button class="btn" id="eTest">Test on File&hellip;</button><button class="btn" id="eCancel">Close</button></div>
   <div class="err" id="eErr"></div><div id="eTestOut"></div></div>`;
  const vis=()=>{const m=$("#eMode").value;
    document.querySelector(".m-foot").style.display=(m==="header_footer"||m==="frame_chain")?"contents":"none";
    document.querySelector(".m-len").style.display=(m==="header_length"||m==="frame_chain")?"contents":"none";
    document.querySelector(".m-chain").style.display=m==="frame_chain"?"contents":"none";};
  $("#eMode").onchange=vis;vis();
  $("#eSave").onclick=async()=>{try{const s2=await api("/api/signatures",readEditor());await loadSigs();EDIT={...SIGS.find(x=>x.id===s2.id)};content();}catch(e){$("#eErr").textContent=e.message}};
  $("#eCancel").onclick=()=>{EDIT=null;content()};
  $("#eTest").onclick=()=>pickFile("Test signature on a sample file",p=>runTest(readEditor(),p));
}
function readEditor(){
  const num=id=>{const v=$(id).value.trim();return v===""?null:Number(v)};
  const m=$("#eMode").value;
  const s={id:$("#eId").value.trim(),name:$("#eName").value.trim(),extension:$("#eExt").value.trim(),mode:m,
    header:$("#eHeader").value.trim(),header_offset:num("#eHOff")||0,footer:"",footer_tail:0,footer_search:"first",on_missing_footer:"skip",
    length_field:null,chain_max_gap:0,channel_field:null,timestamp_field:null,
    min_size:num("#eMin")??16,max_size:num("#eMax")??2147483648,sector_aligned:$("#eAl").checked,
    enabled:$("#eEn").checked,validated:$("#eVal").checked,notes:$("#eNotes").value};
  if(m==="header_footer"||m==="frame_chain"){s.footer=$("#eFooter").value.trim();s.footer_tail=num("#eTail")||0;s.footer_search=$("#eFS").value;s.on_missing_footer=$("#eMiss").value}
  if(m==="header_length"||m==="frame_chain")s.length_field={offset:num("#lOff"),size:Number($("#lSize").value),endian:$("#lEnd").value,adjust:num("#lAdj")||0,multiplier:num("#lMul")||1};
  if(m==="frame_chain"){s.chain_max_gap=num("#eGap")||0;
    if(num("#cOff")!==null)s.channel_field={offset:num("#cOff"),size:Number($("#cSize").value)};
    if(num("#tOff")!==null)s.timestamp_field={offset:num("#tOff"),size:Number($("#tSize").value),endian:$("#tEnd").value,format:$("#tFmt").value};}
  return s;
}
async function runTest(sig,path){
  const out=$("#eTestOut")||$("#content");
  out.innerHTML=`<p class="muted">Testing on ${esc(path)}&hellip;</p>`;
  try{const r=await api("/api/signatures/test",{signature:sig,path,limit:100});
    out.innerHTML=`<h3>Test result: ${r.items.length} item(s), ${r.rejected} rejected hit(s), ${fmt(r.scanned)} scanned</h3>
     ${r.capped?`<div class="err">Only the first ${fmt(r.scanned)} of ${fmt(r.source_size)} was tested. Run a dry-run carve to check the whole source.</div>`:""}
     ${r.max_items_hit?`<div class="err">Stopped at ${r.items.length} items.</div>`:""}
     <table><tr><th>#</th><th>Offset</th><th>Length</th><th>Status</th><th>Frames</th><th>Ch</th><th>First</th><th>Last</th><th>Notes</th></tr>
     ${r.items.map(i=>`<tr><td>${i.item_no}</td><td class="mono">${i.start_hex}</td><td>${Number(i.length).toLocaleString()}</td><td>${esc(i.status)}</td><td>${i.frames||""}</td><td>${esc(i.channels)}</td><td>${esc(i.first_time)}</td><td>${esc(i.last_time)}</td><td>${esc(i.notes)}</td></tr>`).join("")}</table>`;
  }catch(e){out.innerHTML=`<div class="err">${esc(e.message)}</div>`}
}

/* ---------------- results ---------------- */
async function loadRuns(){
  const C=$("#content");
  if(!S.case||!S.case.folder){C.innerHTML=`<div class="card">Open a case first.</div>`;return}
  const runs=await api("/api/runs");
  if(!SELRUN&&runs.length)SELRUN=runs[0].name;
  let items=SELRUN?await api("/api/run?name="+encodeURIComponent(SELRUN)):[];
  C.innerHTML=`<div class="card"><h2>Runs</h2><table><tr><th>Run</th><th>Items</th><th>Finished</th><th>State</th></tr>
   ${runs.map(r=>`<tr class="click ${r.name===SELRUN?'sel':''}" data-run="${esc(r.name)}"><td class="mono">${esc(r.name)}</td><td>${r.items??""}</td><td>${esc(r.finished||"")}</td>
     <td>${!r.complete?'<span class="pill n">running / interrupted</span>':r.canceled?'<span class="pill no">canceled - resumable</span>':r.dry_run?'<span class="pill n">dry run</span>':'<span class="pill ok">complete</span>'}</td></tr>`).join("")||"<tr><td colspan=4>No runs yet</td></tr>"}</table></div>
   <div class="card"><h2>Items ${SELRUN?"&mdash; "+esc(SELRUN):""}</h2><table><tr><th>#</th><th>Signature</th><th>Offset</th><th>Length</th><th>Length is</th><th>Status</th><th>Frames</th><th>Ch</th><th>First (device)</th><th>Last (device)</th><th>File</th><th>Notes</th></tr>
   ${items.map(i=>`<tr class="click ${SELITEM&&SELITEM.item_no===i.item_no?'sel':''}" data-item="${esc(i.item_no)}"><td>${i.item_no}</td><td>${esc(i.signature_name)}</td><td class="mono">${esc(i.start_hex)}</td><td>${Number(i.length).toLocaleString()}</td><td>${esc(i.bounded||"")}</td><td>${esc(i.status)}</td>
     <td>${i.frames!=="0"?esc(i.frames):""}</td><td>${esc(i.channels)}</td><td>${esc(i.first_time)}</td><td>${esc(i.last_time)}</td><td class="mono" style="font-size:11px">${esc(i.file)}</td><td>${esc(i.notes)}</td></tr>`).join("")||"<tr><td colspan=12>No items</td></tr>"}</table></div>`;
  C.querySelectorAll("tr[data-run]").forEach(tr=>tr.onclick=()=>{SELRUN=tr.dataset.run;SELITEM=null;loadRuns()});
  RUNS=runs;
  C.querySelectorAll("tr[data-item]").forEach(tr=>tr.onclick=()=>{SELITEM=items.find(x=>String(x.item_no)===tr.dataset.item);
    C.querySelectorAll("tr[data-item]").forEach(r=>r.classList.toggle("sel",r===tr))});
}

/* ---------------- dialogs ---------------- */
function modal(title,body,buttons){
  $("#mTitle").textContent=title;$("#mBody").innerHTML=body;$("#mFoot").innerHTML="";
  buttons.forEach(([label,fn,cls])=>{const b=document.createElement("button");b.className="btn "+(cls||"");b.textContent=label;b.onclick=fn;$("#mFoot").appendChild(b)});
  $("#modal").classList.add("show");
}
const closeModal=()=>$("#modal").classList.remove("show");
function browser(title,wantFile,cb,start){
  let cur=start||"";
  const draw=async()=>{
    const r=await api("/api/browse?path="+encodeURIComponent(cur));cur=r.path;
    $("#mBody").innerHTML=`<div class="mono" style="margin-bottom:6px">${esc(r.path||"Computer")}</div>
     <input id="bPath" style="width:100%;padding:4px;margin-bottom:6px" placeholder="or type a full path" value="${esc(r.path)}">
     <div class="blist">${r.parent!==undefined&&r.path?`<div class="d" data-up="1">..</div>`:""}
     ${r.dirs.map(d=>`<div class="d" data-d="${esc(d)}">${esc(d)}</div>`).join("")}
     ${wantFile?r.files.map(f=>`<div class="f" data-f="${esc(f.name)}">${esc(f.name)} <span class="muted">${fmt(f.size)}</span></div>`).join(""):""}</div>
     ${r.error?`<div class="err">${esc(r.error)}</div>`:""}`;
    const join=(a,b)=>a?(a.endsWith("\\")||a.endsWith("/")?a+b:a+(a.includes("\\")?"\\":"/")+b):b;
    $("#mBody").querySelectorAll("[data-up]").forEach(e=>e.onclick=()=>{cur=r.parent;draw()});
    $("#mBody").querySelectorAll("[data-d]").forEach(e=>e.onclick=()=>{cur=join(r.path,e.dataset.d);draw()});
    $("#mBody").querySelectorAll("[data-f]").forEach(e=>e.onclick=()=>{$("#bPath").value=join(r.path,e.dataset.f)});
    $("#bPath").onkeydown=ev=>{if(ev.key==="Enter"){cur=$("#bPath").value;draw()}};
  };
  modal(title,"",[["Cancel",closeModal],["Select",()=>{const v=$("#bPath").value.trim();if(v){closeModal();cb(v)}},"amber"]]);
  draw();
}
const pickFile=(t,cb)=>browser(t,true,cb);

function caseDialog(){
  const c=S.case||{};
  modal("New / Open Case",`<div class="form">
    <label>Case folder</label><div style="display:flex;gap:6px"><input id="cFolder" value="${esc(c.folder||"")}"><button class="btn" id="cBrowse">Browse</button></div>
    <div class="hint">An existing folder with case.json is reopened; anything else becomes a new case.</div>
    <label>Case number</label><input id="cNum" value="${esc(c.case_number||"")}">
    <label>Examiner</label><input id="cEx" value="${esc(c.examiner||"")}">
    <label>Agency</label><input id="cAg" value="${esc(c.agency||"")}">
    <label>Description</label><textarea id="cDesc" rows="3">${esc(c.description||"")}</textarea></div><div class="err" id="cErr"></div>`,
   [["Cancel",closeModal],["Open Case",async()=>{try{await api("/api/case",{folder:$("#cFolder").value,case_number:$("#cNum").value,examiner:$("#cEx").value,agency:$("#cAg").value,description:$("#cDesc").value});closeModal();refresh()}catch(e){$("#cErr").textContent=e.message}},"amber"]]);
  $("#cBrowse").onclick=()=>{const keep={n:$("#cNum").value,e:$("#cEx").value,a:$("#cAg").value,d:$("#cDesc").value};
    pickFolderAny("Choose case folder",p=>{caseDialog();$("#cFolder").value=p;$("#cNum").value=keep.n;$("#cEx").value=keep.e;$("#cAg").value=keep.a;$("#cDesc").value=keep.d})};
}
async function driveDialog(){
  modal("Physical Drive","<p class='muted'>Looking for drives&hellip;</p>",[["Cancel",closeModal]]);
  const d=await api("/api/drives");
  $("#mBody").innerHTML=d.length?`<p>Use a hardware write blocker. DFX opens the drive read-only.</p><table><tr><th>Drive</th><th>Size</th><th>Sector</th></tr>
   ${d.map(x=>`<tr class="click" data-p="${esc(x.path)}"><td class="mono">${esc(x.path)}</td><td>${fmt(x.size)}</td><td>${x.sector_size}</td></tr>`).join("")}</table>`
   :`<p>No drives could be opened. On Windows, start DFX <b>as Administrator</b> to read physical drives.</p>`;
  $("#mBody").querySelectorAll("tr[data-p]").forEach(tr=>tr.onclick=()=>{closeModal();setSource(tr.dataset.p)});
}
async function setSource(p){try{await api("/api/source",{path:p});refresh()}catch(e){alert(e.message)}}

/* ---------------- wiring ---------------- */
function on(id,fn){const e=document.getElementById(id);if(e)e.onclick=fn}
function wire(){
  on("bNewCase",caseDialog);
  on("bCaseFolder",()=>api("/api/open",{}).catch(e=>alert(e.message)));
  on("bImage",()=>pickFileAny("Choose evidence image (.E01, .dd, .001, .img ...)",setSource));
  on("bDrive",driveDialog);
  on("bHash",()=>api("/api/hash",{}).catch(e=>alert(e.message)));
  on("bGoCarve",()=>setTab("carve"));
  const carveBody=()=>({signature_ids:[...document.querySelectorAll(".cs:checked")].map(x=>x.value),
    dry_run:$("#oDry").checked,aligned:$("#oAlign").checked,max_items:Number($("#oMax").value||0),
    start:parseOff($("#oStart").value),end:parseOff($("#oEnd").value),chunk_mb:Number($("#oChunk").value||64),dvr_id:($("#oDvr")||{}).value||""});
  on("bStart",async()=>{
    const h=S.evidence_hash||{};
    if(!h.sha256&&!confirm("The evidence has not been hashed in DFX. The report will say so.\n\nStart the carve anyway?"))return;
    try{const r=await api("/api/carve",carveBody());SELRUN=r.run}catch(e){alert(e.message)}});
  on("bCancel",()=>api("/api/cancel",{}));
  on("bCancelJob",()=>{if(!(S.job&&S.job.running))return alert("No job is running.");api("/api/cancel",{})});
  on("bResume",async()=>{
    const runs=(await api("/api/runs")).filter(r=>!r.complete||r.canceled);
    if(!runs.length)return alert("No canceled or interrupted runs to resume.");
    modal("Resume a run",`<p>Resume uses the run's <b>original</b> signatures and options (the options on the ribbon are ignored); the scan continues from its last checkpoint.</p>`+
      runs.map(r=>`<div class="blist"><div data-r="${esc(r.name)}" class="d">${esc(r.name)}</div></div>`).join(""),[["Cancel",closeModal]]);
    $("#mBody").querySelectorAll("[data-r]").forEach(e=>e.onclick=async()=>{closeModal();
      try{const b=carveBody();b.resume_run=e.dataset.r;await api("/api/carve",b)}catch(x){alert(x.message)}});
  });
  on("bSigNew",()=>{EDIT={id:"",name:"",extension:"bin",mode:"header_footer",header:"",header_offset:0,footer:"",footer_tail:0,footer_search:"first",on_missing_footer:"skip",min_size:16,max_size:104857600,enabled:true,validated:false,notes:"",origin:"user",_editing:1};content()});
  on("bSigEdit",()=>{if(!EDIT)return alert("Select a signature first.");EDIT={...EDIT,_editing:1};if(EDIT.origin==="built-in"){EDIT.validated=false}content()});
  on("bSigDel",async()=>{if(!EDIT)return alert("Select a signature first.");if(EDIT.origin!=="user")return alert("Built-in signatures can't be deleted. Copy one to make your own version.");
    if(!confirm(`Delete user signature ${EDIT.id}?`))return;await api("/api/signatures/delete",{id:EDIT.id});EDIT=null;await loadSigs();content()});

const p2=n=>String(n).padStart(2,"0");
function naiveNow(){const d=new Date();return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours(),d.getMinutes(),d.getSeconds(),d.getMilliseconds())}
function nfmt(ms){const d=new Date(ms);return `${d.getUTCFullYear()}-${p2(d.getUTCMonth()+1)}-${p2(d.getUTCDate())} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}:${p2(d.getUTCSeconds())}`}
function ndate(ms){const d=new Date(ms);return `${p2(d.getUTCMonth()+1)}/${p2(d.getUTCDate())}/${d.getUTCFullYear()}`}
function ntime(ms){const d=new Date(ms);let h=d.getUTCHours();const ap=h<12?"AM":"PM";h=h%12||12;return `${p2(h)}:${p2(d.getUTCMinutes())}:${p2(d.getUTCSeconds())} ${ap}`}
function nparse(date,time){if(!date||!time)return null;const [y,m,d]=date.split("-").map(Number);const t=time.split(":").map(Number);return Date.UTC(y,m-1,d,t[0]||0,t[1]||0,t[2]||0)}
const trunc=ms=>Math.floor(ms/1000)*1000;
function dvrNow(){if(CK.dvrMs===null)return null;return CK.paused?CK.pausedMs:CK.dvrMs+(performance.now()-CK.perf0)}
function refNow(){if(CK.refKind==="workstation")return naiveNow();if(CK.extMs===null)return null;return CK.extMs+(performance.now()-CK.extPerf)}

function offText(s){if(s===null)return "Set both clocks";if(s===0)return "Time is exact";const a=Math.abs(s),h=Math.floor(a/3600),m=Math.floor(a%3600/60),x=a%60;

function hms(s){const a=Math.abs(s);return (s<0?"-":"+")+p2(Math.floor(a/3600))+":"+p2(Math.floor(a%3600/60))+":"+p2(a%60)}

let incTimer=null;
function updateIncident(){
  clearTimeout(incTimer);
  incTimer=setTimeout(async()=>{
    const d=selDvr(),out=$("#ckIncOut");if(!out)return;
    const dir=CK.incMode==="actual"?"actual_to_dvr":"dvr_to_actual";
    if(d&&d.measurements.length){
      try{const r=await api("/api/clock/convert",{dvr_id:d.id,time:nfmt(CK.incVal),direction:dir});CK.conv=r;
        out.textContent=dir==="actual_to_dvr"?r.dvr_time:r.actual_time;$("#ckIncOff").textContent=`${r.offset_hms} · ${r.method}`;
        $("#ckIncNotes").innerHTML=r.notes.map(n=>`<div>${esc(n)}</div>`).join("")}
      catch(e){out.textContent="—";$("#ckIncNotes").innerHTML=`<div>${esc(e.message)}</div>`}
    }else{
      const o=quickOffset();CK.conv=null;
      if(o===null){out.textContent="—";$("#ckIncOff").textContent="Set the DVR clock first";$("#ckIncNotes").innerHTML="";return}
      const r=dir==="actual_to_dvr"?CK.incVal+o*1000:CK.incVal-o*1000;
      out.textContent=nfmt(r);$("#ckIncOff").textContent=`${hms(o)} · live offset (unsaved)`;
      $("#ckIncNotes").innerHTML="<div>Unsaved live offset: save the measurement to a DVR to log this conversion and include drift and daylight-saving checks.</div>";
    }
  },150);
}
function tickClock(){

  if(CK.live&&$("#ckLA")){

/* ---------------- hex viewer (read-only) ---------------- */
const HX={target:"evidence",path:"",offset:0,page:1024,bytes:null,size:0,sel:null,anchor:null,hdrLen:0,
  len:null,endian:"little",adj:0,foot:null,frames:true,hl:null};
const h2=n=>n.toString(16).toUpperCase().padStart(2,"0");
const hx=n=>"0x"+n.toString(16).toUpperCase();
function parseNum(v){v=String(v||"").trim().replace(/,/g,"");if(!v)return null;const n=v.toLowerCase().startsWith("0x")?parseInt(v,16):Number(v);return isFinite(n)?n:null}
async function hexLoad(off){
  try{const r=await api("/api/hex",{target:HX.target,path:HX.path,offset:Math.max(0,off),length:HX.page});
    HX.offset=r.offset;HX.size=r.size;HX.bytes=new Uint8Array(r.hex.match(/../g)?.map(x=>parseInt(x,16))||[]);HX.label=r.path;
    renderHex()}catch(e){$("#content").innerHTML=`<div class="card"><h2>Hex viewer</h2><div class="err">${esc(e.message)}</div><p class="muted">Select evidence on the Home tab, or use <b>Open File</b>.</p></div>`}
}
function selBytes(){if(!HX.sel||!HX.bytes)return null;const a=Math.min(HX.sel.a,HX.sel.b),b=Math.max(HX.sel.a,HX.sel.b);
  const ra=a-HX.offset,rb=b-HX.offset;if(ra<0||rb>=HX.bytes.length)return null;return {a,b,len:b-a+1,bytes:HX.bytes.slice(ra,rb+1)}}
function uint(bytes,le){let v=0n;const arr=le?[...bytes].reverse():[...bytes];for(const x of arr)v=(v<<8n)+BigInt(x);return v}
function interp(bytes){
  const rows=[];const n=bytes.length;
  if([1,2,4,8].includes(n)){
    rows.push(["unsigned LE",uint(bytes,true).toLocaleString()],["unsigned BE",uint(bytes,false).toLocaleString()]);
    if(n===4){
      const le=Number(uint(bytes,true)),be=Number(uint(bytes,false));
      const ut=v=>{const d=new Date(v*1000);return v>946684800&&v<2208988800?d.toISOString().replace("T"," ").slice(0,19)+" UTC":"—"};
      const dp=v=>{const s=v&63,mi=(v>>>6)&63,h=(v>>>12)&31,d=(v>>>17)&31,mo=(v>>>22)&15,y=(v>>>26)+2000;
        return (mo>=1&&mo<=12&&d>=1&&d<=31&&h<24&&mi<60&&s<60)?`${y}-${p2(mo)}-${p2(d)} ${p2(h)}:${p2(mi)}:${p2(s)}`:"—"};
      rows.push(["Unix time LE",ut(le)],["Unix time BE",ut(be)],["Dahua packed LE",dp(le)],["Dahua packed BE",dp(be)]);
    }
    if(n===8){const ft=uint(bytes,true);const ms=Number(ft/10000n)-11644473600000;rows.push(["FILETIME LE",ms>946684800000&&ms<4102444800000?new Date(ms).toISOString().replace("T"," ").slice(0,19)+" UTC":"—"])}
  }
  rows.push(["ASCII",[...bytes].map(b=>b>=32&&b<127?String.fromCharCode(b):".").join("")]);
  return rows;
}
function hexClass(o){
  const c=[];
  if(HX.anchor!==null&&o>=HX.anchor&&o<HX.anchor+HX.hdrLen)c.push("hxhdr");
  if(HX.len&&HX.anchor!==null&&o>=HX.anchor+HX.len.offset&&o<HX.anchor+HX.len.offset+HX.len.size)c.push("hxlen");
  if(HX.foot&&o>=HX.foot.at&&o<HX.foot.at+HX.foot.len)c.push("hxfoot");
  if(HX.hl&&o>=HX.hl.a&&o<HX.hl.b)c.push("hxhl");
  if(HX.sel){const a=Math.min(HX.sel.a,HX.sel.b),b=Math.max(HX.sel.a,HX.sel.b);if(o>=a&&o<=b)c.push("hxsel")}
  return c.join(" ");
}
function renderHex(){
  const C=$("#content");
  if(!HX.bytes){hexLoad(HX.offset);C.innerHTML=`<div class="card"><p class="muted">Loading&hellip;</p></div>`;return}
  let rows="";
  for(let r=0;r<HX.bytes.length;r+=16){
    const off=HX.offset+r;let hb="",as="";
    for(let i=0;i<16;i++){const k=r+i;if(k>=HX.bytes.length){hb+=`<span> </span>`;as+=`<span> </span>`;continue}
      const b=HX.bytes[k],o=off+i,cl=hexClass(o);
      hb+=`<span data-o="${o}" class="${cl}">${h2(b)}</span>`;as+=`<span data-o="${o}" class="${cl}">${b>=32&&b<127?esc(String.fromCharCode(b)):"."}</span>`}
    rows+=`<div class="hxrow"><span class="hxoff">${off.toString(16).toUpperCase().padStart(10,"0")}</span><span class="hxbytes">${hb}</span><span class="hxasc">${as}</span></div>`;
  }
  const sb=selBytes();
  const lenInfo=HX.len&&HX.anchor!==null?(()=>{const ra=HX.anchor+HX.len.offset-HX.offset;
      if(ra<0||ra+HX.len.size>HX.bytes.length)return `<div>Length value</div><div class="muted">not on this page</div>`;
      const v=Number(uint(HX.bytes.slice(ra,ra+HX.len.size),HX.endian==="little"));
      return `<div>Length value</div><div>${v.toLocaleString()} &rarr; next at ${hx(HX.anchor+v+HX.adj)}</div>`})():"";
  C.innerHTML=`<div class="hx"><div class="card"><h2 style="display:flex;gap:10px;align-items:baseline">Hex &mdash; read-only <span class="muted mono" style="font-size:12px;font-weight:400">${esc(HX.label||"")} &middot; ${fmt(HX.size)} &middot; ${hx(HX.offset)}&ndash;${hx(HX.offset+HX.bytes.length-1)}</span></h2>
     <div class="hxgrid" id="hxgrid">${rows||'<span class="muted">End of source</span>'}</div>
     <div class="legend muted" style="margin-top:6px"><span class="hxsel">selection</span><span class="hxhdr">header</span><span class="hxlen">length field</span><span class="hxfoot">footer</span><span class="hxhl">item</span> Click a byte; Shift+click to extend.</div></div>
   <div><div class="card"><h2>Selection</h2>${sb?`<div class="kvs"><div>Offset</div><div class="mono">${hx(sb.a)} (${sb.a.toLocaleString()})</div><div>Length</div><div>${sb.len.toLocaleString()} byte(s)</div>
      ${HX.anchor!==null?`<div>From header</div><div>+${(sb.a-HX.anchor).toLocaleString()}</div>`:""}
      ${sb.len<=64?`<div>Hex</div><div class="mono">${[...sb.bytes].map(h2).join(" ")}</div>`:""}
      ${interp(sb.len<=64?sb.bytes:sb.bytes.slice(0,64)).map(([k,v])=>`<div>${k}</div><div class="mono">${esc(v)}</div>`).join("")}</div>`:'<p class="muted">Nothing selected.</p>'}</div>
    <div class="card" style="margin-top:12px"><h2>Signature being built</h2><div class="kvs">
      <div>Header</div><div class="mono">${HX.anchor!==null?esc(headerHex())+` @ ${hx(HX.anchor)}`:"&mdash;"}</div>
      <div>Length field</div><div>${HX.len?`offset ${HX.len.offset}, ${HX.len.size} B, <select id="hxEnd"><option ${HX.endian==="little"?"selected":""}>little</option><option ${HX.endian==="big"?"selected":""}>big</option></select> adjust <input id="hxAdj" type="number" value="${HX.adj}" style="width:64px">`:"&mdash;"}</div>
      ${lenInfo}
      <div>Footer</div><div class="mono">${HX.foot?esc(HX.foot.hex):"&mdash;"}</div>
      <div>Item is</div><div><label><input type="checkbox" id="hxFrames" ${HX.frames?"checked":""}> a stream of frames</label></div></div>
      <p class="muted" style="margin:8px 0 0">Select the first bytes of a frame or file &rarr; <b>Use as Header</b>. Select its size bytes &rarr; <b>Length Field</b>, then <b>Follow Length</b> to check it lands on the next header.</p></div></div></div>`;
  const grid=$("#hxgrid");
  grid.querySelectorAll("[data-o]").forEach(el=>el.onclick=e=>{const o=Number(el.dataset.o);
    HX.sel=e.shiftKey&&HX.sel?{a:HX.sel.a,b:o}:{a:o,b:o};const st=grid.scrollTop;renderHex();$("#hxgrid").scrollTop=st});
  if($("#hxEnd"))$("#hxEnd").onchange=e=>{HX.endian=e.target.value;renderHex()};
  if($("#hxAdj"))$("#hxAdj").onchange=e=>{HX.adj=Number(e.target.value)||0;renderHex()};
  $("#hxFrames").onchange=e=>HX.frames=e.target.checked;
}
function headerHex(){if(HX.anchor===null)return "";const ra=HX.anchor-HX.offset;
  return HX.hdrBytes?HX.hdrBytes:(ra>=0?[...HX.bytes.slice(ra,ra+HX.hdrLen)].map(h2).join(" "):"")}
function hexOpen(target,path,offset,hl){HX.target=target;HX.path=path||"";HX.bytes=null;HX.sel=null;HX.hl=hl||null;HX.offset=Math.max(0,(offset||0)-(offset||0)%16);setTab("hex")}
async function hexFind(){
  const q=$("#hxQ").value.trim();if(!q)return;
  const from=(HX.sel?Math.min(HX.sel.a,HX.sel.b):HX.offset-1)+1;
  toast("Searching…");

    if(r.found===null){alert(r.end_of_source?"Not found before the end of the source.":`Not found in the next ${fmt(r.scanned)}. Press Find next to keep searching from ${hx(r.stopped_at)}.`);

function hexToEditor(){

   ${VAL.list.map(v=>`<tr><td class="mono">${esc(v.signature_id)}</td><td>${esc(v.finished)}</td>
     <td>${v.verdict==="PASS"?'<span class="pill ok">PASS</span>':`<span class="pill no" title="${esc(v.failures.join("; "))}">FAIL</span>`}</td>
     <td>${v.recovered} of ${v.known}</td><td>${v.unexpected}</td><td>${v.negative===null||v.negative===undefined?"&mdash;":v.negative}</td>
     <td><button class="btn" data-vrep="${esc(v.name)}">Report</button> ${v.verdict!=="PASS"?"":(()=>{const sg=SIGS.find(x=>x.id===v.signature_id);
       return sg&&sg.validated&&sg.validation&&String(sg.validation.report).includes(v.name)?'<span class="pill ok">marked validated</span>':`<button class="btn amber" data-vmark="${esc(v.name)}">Mark Validated</button>`})()}</td></tr>`).join("")||'<tr><td colspan=7 class="muted">None yet</td></tr>'}</table>
   <div class="err" id="vErr"></div></div>`;
}
function wireValidate(){
  const keep=()=>{VAL.sigId=$("#vSig").value;VAL.test=$("#vTest").value.trim();VAL.neg=$("#vNeg").value.trim();VAL.allow=$("#vAllow").checked};
  document.querySelectorAll("[data-vrm]").forEach(b=>b.onclick=()=>{keep();VAL.known.splice(Number(b.dataset.vrm),1);content()});
  $("#vAdd").onclick=async()=>{keep();const p=await pickNative("files","Choose the known files (originals)");
    if(p===null)return pickFile("Add a known file",x=>{VAL.known.push(x);content()});p.forEach(x=>VAL.known.includes(x)||VAL.known.push(x));content()};
  $("#vTestB").onclick=()=>{keep();pickFileAny("Choose the test image",p=>{VAL.test=p;content()})};
  $("#vNegB").onclick=()=>{keep();pickFileAny("Choose the negative image",p=>{VAL.neg=p;content()})};
  $("#vClose").onclick=()=>{keep();VAL.open=false;content()};
  $("#vRun").onclick=async()=>{keep();
    try{await api("/api/validate",{signature_id:VAL.sigId,known_files:VAL.known,test_image:VAL.test,negative_image:VAL.neg,allow_other:VAL.allow});
      toast("Validation started - progress is in the status bar","ok");setTimeout(content,300)}catch(e){$("#vErr").textContent=e.message}};
  document.querySelectorAll("[data-vrep]").forEach(b=>b.onclick=()=>window.open("/validation/"+encodeURIComponent(b.dataset.vrep)+"/report.html","_blank"));
  document.querySelectorAll("[data-vmark]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Mark this signature VALIDATED for this version of DFX?\n\nThe record and report are linked to the signature. Changing the signature later clears it."))return;
    try{const sg=await api("/api/validate/mark",{name:b.dataset.vmark});await loadSigs();toast(`${sg.name} marked validated`,"ok");content()}
    catch(e){$("#vErr").textContent=e.message}});
}

/* ---------------- state polling ---------------- */
function side(){
  const c=S.case||{},e=S.source||{},h=S.evidence_hash||{},j=S.job||{};
  $("#ver").textContent=(S.version||"")+(S.prerelease?" pre-release":"");
  $("#casebadge").textContent=c.case_number?`Case ${c.case_number}${c.examiner?" · "+c.examiner:""}`:(c.folder?"Case open":"No case open");
  $("#sideCase").innerHTML=c.folder?`<div>Number</div><div>${esc(c.case_number||"")}</div><div>Examiner</div><div>${esc(c.examiner||"")}</div><div>Folder</div><div class="mono">${esc(c.folder)}</div>`:`<div>&mdash;</div><div class="muted">New / Open Case</div>`;
  $("#sideEv").innerHTML=e.path?`<div>Source</div><div class="mono">${esc(e.path)}</div><div>Type</div><div>${esc(e.kind)}</div><div>Size</div><div>${fmt(e.size)}</div>
    <div>MD5</div><div class="mono">${esc(h.md5||"not hashed")}</div><div>SHA-256</div><div class="mono">${esc(h.sha256||"")}</div>`:`<div>&mdash;</div><div class="muted">Image File or Physical Drive</div>`;
  const p=j.progress||{};const pct=p.total?Math.min(100,100*p.done/p.total):0;
  $("#sideJob").innerHTML=j.type?`<div>Job</div><div>${esc(j.type)}${j.running?" (running)":""}</div>${p.items!==undefined?`<div>Items</div><div>${p.items}</div>`:""}
    ${j.error?`<div>Error</div><div class="err">${esc(j.error)}</div>`:""}`:`<div>&mdash;</div><div class="muted">idle</div>`;
  $("#stBar").style.width=(j.running?pct:0)+"%";
  $("#stPct").textContent=j.running?`${pct.toFixed(1)}%  ${fmt(p.done)} / ${fmt(p.total)}${p.elapsed&&p.done?"  ·  "+eta(p):""}`:"";
  $("#stText").textContent=j.running?`${{carve:"Carving",hash:"Hashing",validate:"Validating"}[j.type]||"Working"}${p.stage?" ("+p.stage+")":""}…`:(j.error?"Last job failed":"Ready");
  const log=j.log||[];if(log.length!==lastLogLen){$("#log").textContent=log.join("\n");$("#log").scrollTop=1e9;lastLogLen=log.length;
    $("#lastlog").textContent=log.length?log[log.length-1]:""}
}
function eta(p){const rate=p.done/p.elapsed;const s=(p.total-p.done)/rate;if(!isFinite(s))return"";const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return `${(rate/1048576).toFixed(0)} MB/s, ${h}h ${m}m left`}
/* ---------------- case log panel: collapsed by default, resizable, remembered ---------------- */
const store={get(k,d){try{const v=localStorage.getItem("dfx."+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem("dfx."+k,JSON.stringify(v))}catch(e){}}};
function setLog(open){$("#logwrap").classList.toggle("open",open);$("#logbtn").innerHTML=open?"Log &#9660;":"Log &#9650;";
  $("#lastlog").style.display=open?"none":"";store.set("logOpen",open);if(open)$("#log").scrollTop=1e9}
$("#logbtn").onclick=()=>setLog(!$("#logwrap").classList.contains("open"));
$("#lastlog").onclick=()=>setLog(true);$("#lastlog").style.cursor="pointer";$("#lastlog").title="Click to open the case log";
$("#log").style.height=store.get("logHeight",150)+"px";
setLog(store.get("logOpen",false));
$("#loggrip").onmousedown=e=>{e.preventDefault();const y0=e.clientY,h0=$("#log").offsetHeight;
  const mv=ev=>{const h=Math.max(60,Math.min(window.innerHeight*0.6,h0+(y0-ev.clientY)));$("#log").style.height=h+"px"};
  const up=()=>{document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);store.set("logHeight",$("#log").offsetHeight)};
  document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up)};

let lastDone=null;
async function refresh(){try{S=await api("/api/state");side();
  const finished=lastDone!==null&&S.job.done_seq!==lastDone&&!S.job.running;
  lastDone=S.job.done_seq;
  if(finished){if(TAB==="results")loadRuns();
    if(S.job.type==="validate"){await loadValidations();
      if(S.job.error)toast("Validation stopped: "+S.job.error,"bad");
      else if(S.job.result)toast(`Validation ${S.job.result.verdict}`,S.job.result.verdict==="PASS"?"ok":"bad");
      if(TAB==="sigs"&&VAL.open)content()}}
  }catch(e){$("#stText").textContent="Server not responding"}}
async function loadSigs(){SIGS=await api("/api/signatures")}
(async()=>{await loadSigs();await refresh();setTab("home");setInterval(refresh,1000)})();
</script>
